{"t": "‘Very well.", "sk": "Very well.", "skk": "좋아요.", "ko": "\"'좋습니다.'\"", "c": [["‘Very well.", "동의", "'좋습니다.", null]], "n": ""},
{"t": "And, I say, Doctor, there may be some little danger, so kindly put your army revolver in your pocket.’", "sk": "And, I say, Doctor, there may be some little danger, so kindly put your army revolver in your pocket.", "skk": "그리고, 저기, 의사 선생, 약간의 위험이 있을 수 있으니 군용 리볼버를 주머니에 넣어와요.", "ko": "\"그리고, 저기, 의사 선생, 약간의 위험이 있을 수도 있으니 부디 군용 리볼버를 주머니에 챙겨 오시죠.'\"", "c": [["And, I say, Doctor, there may be some little danger", "상황", "그리고, 저기, 의사 선생, 약간의 위험이 있을 수도 있으니", null], ["so kindly put your army revolver in your pocket.’", "부탁", "부디 군용 리볼버를 주머니에 챙겨 오시죠.'", null]], "n": "I say는 여기서 상대의 주의를 끄는 \"저기, 이봐요\"라는 감탄사입니다."},
{"t": "He waved his hand, turned on his heel, and disappeared in an instant among the crowd.", "sk": "He waved his hand, turned on his heel, and disappeared in an instant among the crowd.", "skk": "그는 손을 흔들고, 홱 돌아서더니, 순식간에 인파 속으로 사라졌습니다.", "ko": "\"그는 손을 흔들고, 발꿈치를 축으로 홱 돌아서더니, 순식간에 인파 속으로 사라져버렸습니다.\"", "c": [["He waved his hand", "동사 ①", "그는 손을 흔들었습니다", null], ["turned on his heel", "동사 ②", "발꿈치를 축으로 홱 돌아서더니", null], ["and disappeared in an instant among the crowd.", "동사 ③", "순식간에 인파 속으로 사라져버렸습니다.", null]], "n": "turn on one’s heel은 \"홱 돌아서다\"라는 뜻입니다."},
{"t": "I trust that I am not more dense than my neighbours, but I was always oppressed with a sense of my own stupidity in my dealings with Sherlock Holmes.", "sk": "I trust that I am not more dense than my neighbours, but I was always oppressed with a sense of my own stupidity in my dealings with Sherlock Holmes.", "skk": "제가 남들보다 특별히 둔하지는 않다고 믿지만, 셜록 홈즈와 얽힐 때면 늘 제 자신의 어리석음이라는 감각에 짓눌렸습니다.", "ko": "\"저는 제가 이웃들보다 특별히 둔한 사람은 아니라고 믿지만, 셜록 홈즈와의 거래에서만큼은 언제나 제 자신의 어리석음에 대한 자각에 짓눌리곤 했습니다.\"", "c": [["I trust that I am not more dense than my neighbours", "주어+동사", "저는 제가 이웃들보다 특별히 둔한 사람은 아니라고 믿습니다", null], ["but I was always oppressed with a sense of my own stupidity in my dealings with Sherlock Holmes.", "대조", "하지만 셜록 홈즈와의 거래에서만큼은 언제나 제 자신의 어리석음에 대한 자각에 짓눌리곤 했습니다.", null]], "n": "dense는 여기서 \"둔한, 눈치 없는\"이라는 뜻입니다. oppressed는 \"짓눌린, 억눌린\", dealings는 \"거래, 교류\"라는 뜻입니다."},
{"t": "Here I had heard what he had heard, I had seen what he had seen, and yet from his words it was evident that he saw clearly not only what had happened but what was about to happen, while to me the whole business was still confused and grotesque.", "sk": "I had heard what he had heard, I had seen what he had seen, and yet it was evident that he saw clearly what was about to happen, while to me the whole business was still confused and grotesque.", "skk": "저도 그가 들은 걸 듣고 본 걸 봤는데도, 그는 앞으로 일어날 일까지 또렷이 보고 있는 게 분명했습니다, 저에게는 이 사건 전체가 여전히 혼란스럽고 기괴했지만요.", "ko": "\"저도 여기서 그가 들은 것을 들었고, 그가 본 것을 보았는데도, 그의 말로 미루어 보면 그는 이미 일어난 일뿐 아니라 앞으로 일어날 일까지 또렷이 보고 있는 것이 분명했습니다, 반면 저에게는 이 사건 전체가 여전히 혼란스럽고 기괴하기만 했습니다.\"", "c": [["Here I had heard what he had heard, I had seen what he had seen", "주어+동사 ①", "저도 여기서 그가 들은 것을 들었고, 그가 본 것을 보았습니다", null], ["and yet from his words it was evident that he saw clearly not only what had happened but what was about to happen", "주어+동사 ②", "그런데도 그의 말로 미루어 보면 그는 이미 일어난 일뿐 아니라 앞으로 일어날 일까지 또렷이 보고 있는 것이 분명했습니다", null], ["while to me the whole business was still confused and grotesque.", "대조", "반면 저에게는 이 사건 전체가 여전히 혼란스럽고 기괴하기만 했습니다.", null]], "n": "evident는 \"분명한, 명백한\"이라는 뜻입니다. grotesque는 \"기괴한\"이라는 뜻입니다."},
{"t": "As I drove home to my house in Kensington I thought over it all, from the extraordinary story of the red-headed copier of the Encyclopædia down to the visit to Saxe-Coburg Square, and the ominous words with which he had parted from me.", "sk": "As I drove home to my house in Kensington I thought over it all, from the story of the red-headed copier down to the visit to Saxe-Coburg Square, and the ominous words with which he had parted from me.", "skk": "켄싱턴 집으로 차를 몰고 가면서 저는 그 모든 일을 되짚어봤습니다, 빨간 머리 필경사 이야기부터 색스코버그 스퀘어 방문, 그리고 그가 헤어지며 남긴 불길한 말까지.", "ko": "\"켄싱턴에 있는 제 집으로 차를 몰고 돌아가면서 저는 그 모든 일을 처음부터 되짚어봤습니다, 백과사전을 베끼던 그 빨간 머리 남자의 기이한 이야기부터 색스코버그 스퀘어 방문, 그리고 그가 저와 헤어지며 남긴 불길한 말까지 말입니다.\"", "c": [["As I drove home to my house in Kensington I thought over it all", "주어+동사", "켄싱턴에 있는 제 집으로 차를 몰고 돌아가면서 저는 그 모든 일을 처음부터 되짚어봤습니다", null], ["from the extraordinary story of the red-headed copier of the Encyclopædia down to the visit to Saxe-Coburg Square", "범위 ①", "백과사전을 베끼던 그 빨간 머리 남자의 기이한 이야기부터 색스코버그 스퀘어 방문까지", null], ["and the ominous words with which he had parted from me.", "범위 ②", "그리고 그가 저와 헤어지며 남긴 불길한 말까지 말입니다.", null]], "n": "copier는 \"베끼는 사람, 필경사\"라는 뜻입니다. ominous는 \"불길한\"이라는 뜻입니다."},
{"t": "What was this nocturnal expedition, and why should I go armed?", "sk": "What was this nocturnal expedition, and why should I go armed?", "skk": "이 야간 원정은 뭐고, 왜 무장하고 가야 하지?", "ko": "\"이 야간 원정은 도대체 무엇이고, 왜 무장을 하고 가야 하는 걸까?\"", "c": [["What was this nocturnal expedition", "질문 ①", "이 야간 원정은 도대체 무엇이고", null], ["and why should I go armed?", "질문 ②", "왜 무장을 하고 가야 하는 걸까?", null]], "n": "nocturnal은 \"밤의, 야간의\", expedition은 \"원정, 탐험\"이라는 뜻입니다. armed는 \"무장한\"이라는 뜻입니다."},
{"t": "Where were we going, and what were we to do?", "sk": "Where were we going, and what were we to do?", "skk": "우리는 어디로 가는 거고, 뭘 하게 되는 걸까?", "ko": "\"우리는 대체 어디로 가고 있으며, 무엇을 하게 될 것인가?\"", "c": [["Where were we going", "질문 ①", "우리는 대체 어디로 가고 있으며", null], ["and what were we to do?", "질문 ②", "무엇을 하게 될 것인가?", null]], "n": ""},
{"t": "I had the hint from Holmes that this smooth-faced pawnbroker’s assistant was a formidable man—a man who might play a deep game.", "sk": "I had the hint from Holmes that this smooth-faced pawnbroker’s assistant was a formidable man—a man who might play a deep game.", "skk": "홈즈에게서 이 매끈한 얼굴의 전당포 조수가 만만치 않은 사람이라는, 깊은 속셈을 품고 있을지 모를 사람이라는 암시를 받았습니다.", "ko": "\"저는 홈즈에게서 이 매끈한 얼굴의 전당포 조수가 만만치 않은 사람이라는, 즉 뭔가 깊은 속셈을 꾸미고 있을지도 모를 사람이라는 암시를 받았습니다.\"", "c": [["I had the hint from Holmes", "주어+동사", "저는 홈즈에게서 암시를 받았습니다", null], ["that this smooth-faced pawnbroker’s assistant was a formidable man—a man who might play a deep game.", "무슨 암시", "이 매끈한 얼굴의 전당포 조수가 만만치 않은 사람이라는, 즉 뭔가 깊은 속셈을 꾸미고 있을지도 모를 사람이라는", "hint"]], "n": "smooth-faced는 \"매끈한 얼굴의(수염 없는)\", formidable은 \"만만치 않은, 무서운\"이라는 뜻입니다. play a deep game은 \"깊은 속셈을 꾸미다\"라는 뜻입니다."},
{"t": "I tried to puzzle it out, but gave it up in despair and set the matter aside until night should bring an explanation.", "sk": "I tried to puzzle it out, but gave it up in despair and set the matter aside until night should bring an explanation.", "skk": "곰곰이 풀어보려 했지만, 절망 속에 포기하고 밤이 설명을 가져다줄 때까지 그 문제를 제쳐뒀습니다.", "ko": "\"저는 그것을 곰곰이 풀어보려 애썼지만, 결국 절망 속에 포기하고, 밤이 되면 답이 나오겠거니 하며 그 문제를 제쳐두었습니다.\"", "c": [["I tried to puzzle it out", "주어+동사 ①", "저는 그것을 곰곰이 풀어보려 애썼습니다", null], ["but gave it up in despair", "주어+동사 ②", "하지만 결국 절망 속에 포기하고", null], ["and set the matter aside until night should bring an explanation.", "주어+동사 ③", "밤이 되면 답이 나오겠거니 하며 그 문제를 제쳐두었습니다.", null]], "n": "puzzle out은 \"곰곰이 생각해서 풀다\"라는 뜻입니다. despair는 \"절망\", set aside는 \"제쳐두다\"라는 뜻입니다."},
{"t": "It was a quarter-past nine when I started from home and made my way across the Park, and so through Oxford Street to Baker Street.", "sk": "It was a quarter-past nine when I started from home and made my way across the Park, and so through Oxford Street to Baker Street.", "skk": "9시 15분에 집을 나서 공원을 가로질러, 옥스퍼드 가를 지나 베이커 가로 향했습니다.", "ko": "\"9시 15분이 되어서야 저는 집을 나서서 공원을 가로질렀고, 그렇게 옥스퍼드 가를 지나 베이커 가로 향했습니다.\"", "c": [["It was a quarter-past nine when I started from home", "시점", "9시 15분이 되어서야 저는 집을 나섰습니다", null], ["and made my way across the Park, and so through Oxford Street to Baker Street.", "동사", "그리고 공원을 가로질러, 옥스퍼드 가를 지나 베이커 가로 향했습니다.", null]], "n": "make one’s way는 \"길을 헤쳐 나아가다, 가다\"라는 뜻입니다."},
{"t": "Two hansoms were standing at the door, and as I entered the passage I heard the sound of voices from above.", "sk": "Two hansoms were standing at the door, and as I entered the passage I heard the sound of voices from above.", "skk": "이륜마차 두 대가 문 앞에 서 있었고, 통로에 들어서자 위층에서 말소리가 들렸습니다.", "ko": "\"이륜마차 두 대가 문 앞에 서 있었고, 제가 통로로 들어서자 위층에서 말소리가 들려왔습니다.\"", "c": [["Two hansoms were standing at the door", "주어+동사 ①", "이륜마차 두 대가 문 앞에 서 있었습니다", null], ["and as I entered the passage I heard the sound of voices from above.", "주어+동사 ②", "그리고 제가 통로로 들어서자 위층에서 말소리가 들려왔습니다.", null]], "n": "hansom은 \"(당시의) 이륜마차\"를 뜻합니다."},
{"t": "On entering his room, I found Holmes in animated conversation with two men, one of whom I recognised as Peter Jones, the official police agent, while the other was a long, thin, sad-faced man, with a very shiny hat and oppressively respectable frock-coat.", "sk": "On entering his room, I found Holmes in animated conversation with two men, one of whom I recognised as Peter Jones, while the other was a long, thin, sad-faced man, with a very shiny hat and frock-coat.", "skk": "방에 들어서자 홈즈가 두 남자와 활기차게 대화하고 있었습니다, 한 명은 피터 존스로 알아봤고, 다른 한 명은 길고 마른 수심 어린 얼굴의 남자로, 반들반들한 모자와 프록코트 차림이었습니다.", "ko": "\"그의 방에 들어서자 저는 홈즈가 두 남자와 활기차게 대화를 나누고 있는 것을 보았습니다, 그중 한 명은 공식 경찰 요원인 피터 존스로 알아보았고, 다른 한 명은 길고 마른, 수심 어린 얼굴의 남자로, 반들반들한 모자와 답답할 만큼 점잖은 프록코트 차림이었습니다.\"", "c": [["On entering his room, I found Holmes in animated conversation with two men", "주어+동사", "그의 방에 들어서자 저는 홈즈가 두 남자와 활기차게 대화를 나누고 있는 것을 보았습니다", null], ["one of whom I recognised as Peter Jones, the official police agent", "부연 ①", "그중 한 명은 공식 경찰 요원인 피터 존스로 알아보았고", null], ["while the other was a long, thin, sad-faced man, with a very shiny hat and oppressively respectable frock-coat.", "부연 ②", "다른 한 명은 길고 마른, 수심 어린 얼굴의 남자로, 반들반들한 모자와 답답할 만큼 점잖은 프록코트 차림이었습니다.", null]], "n": "animated는 \"활기찬\", sad-faced는 \"수심에 찬 얼굴의\"라는 뜻입니다. oppressively는 \"답답할 만큼, 지나치게\"라는 뜻이고, frock-coat는 당시 남성들이 입던 \"프록코트\"를 가리킵니다."},
{"t": "‘Ha! Our party is complete,’ said Holmes, buttoning up his pea-jacket and taking his heavy hunting crop from the rack.", "sk": "Ha! Our party is complete, said Holmes, buttoning up his pea-jacket and taking his heavy hunting crop from the rack.", "skk": "하! 일행이 다 모였네요, 피코트 단추를 채우고 걸이에서 묵직한 채찍을 집으며 홈즈가 말했다.", "ko": "\"'하! 일행이 다 모였군요,' 피코트 단추를 채우고 걸이에서 묵직한 사냥용 채찍을 집어 들며 홈즈가 말했습니다.\"", "c": [["‘Ha! Our party is complete,’ said Holmes", "화자", "'하! 일행이 다 모였군요,' 홈즈가 말했습니다", null], ["buttoning up his pea-jacket and taking his heavy hunting crop from the rack.", "동시 동작", "피코트 단추를 채우고 걸이에서 묵직한 사냥용 채찍을 집어 들며", null]], "n": "pea-jacket은 짧고 두꺼운 \"피코트\"를 뜻하고, hunting crop은 \"사냥용 채찍\"을 뜻합니다."},
{"t": "‘Watson, I think you know Mr. Jones, of Scotland Yard?", "sk": "Watson, I think you know Mr. Jones, of Scotland Yard?", "skk": "왓슨, 스코틀랜드 야드의 존스 씨는 알죠?", "ko": "\"'왓슨, 스코틀랜드 야드의 존스 씨는 알고 계시죠?'\"", "c": [["‘Watson, I think you know Mr. Jones, of Scotland Yard?", "질문", "'왓슨, 스코틀랜드 야드의 존스 씨는 알고 계시죠?'", null]], "n": "Scotland Yard는 런던 경찰청을 가리킵니다."},
{"t": "Let me introduce you to Mr. Merryweather, who is to be our companion in to-night’s adventure.’", "sk": "Let me introduce you to Mr. Merryweather, who is to be our companion in to-night’s adventure.", "skk": "메리웨더 씨를 소개할게요, 오늘 밤 모험에서 우리와 함께할 분이에요.", "ko": "\"'메리웨더 씨를 소개해드리죠, 오늘 밤 모험에서 우리와 동행하실 분입니다.'\"", "c": [["Let me introduce you to Mr. Merryweather", "제안", "'메리웨더 씨를 소개해드리죠", null], ["who is to be our companion in to-night’s adventure.’", "부연", "오늘 밤 모험에서 우리와 동행하실 분입니다.'", "Merryweather"]], "n": ""},
{"t": "‘We’re hunting in couples again, Doctor, you see,’ said Jones in his consequential way.", "sk": "We’re hunting in couples again, Doctor, you see, said Jones in his consequential way.", "skk": "우리가 또 짝지어 사냥하네요, 의사 선생, 존스가 거들먹거리며 말했다.", "ko": "\"'또 짝을 지어 사냥에 나섰습니다, 의사 선생,' 존스가 거들먹거리는 투로 말했습니다.\"", "c": [["‘We’re hunting in couples again, Doctor, you see,’", "소감", "'또 짝을 지어 사냥에 나섰습니다, 의사 선생,'", null], ["said Jones in his consequential way.", "누가 어떻게 말했는지", "존스가 거들먹거리는 투로 말했습니다.", null]], "n": "consequential은 여기서 \"거들먹거리는, 자기가 중요한 듯 구는\"이라는 뜻입니다."},
{"t": "‘Our friend here is a wonderful man for starting a chase.", "sk": "Our friend here is a wonderful man for starting a chase.", "skk": "이 친구는 추적을 시작하는 데는 대단한 사람이죠.", "ko": "\"'여기 이 친구는 추적을 시작하는 데는 대단한 사람입니다.'\"", "c": [["‘Our friend here is a wonderful man for starting a chase.", "평가", "'여기 이 친구는 추적을 시작하는 데는 대단한 사람입니다.", null]], "n": ""},
{"t": "All he wants is an old dog to help him to do the running down.’", "sk": "All he wants is an old dog to help him to do the running down.", "skk": "그에게 필요한 건 뒤쫓는 걸 도와줄 늙은 사냥개뿐이에요.", "ko": "\"'그에게 필요한 것은 그를 도와 끝까지 뒤쫓아 잡아줄 늙은 사냥개 한 마리뿐이죠.'\"", "c": [["All he wants is an old dog", "주어+동사", "'그에게 필요한 것은 늙은 사냥개 한 마리뿐입니다", null], ["to help him to do the running down.’", "부연", "그를 도와 끝까지 뒤쫓아 잡아줄", "dog"]], "n": "run down은 \"끝까지 쫓아가서 잡다\"라는 뜻입니다."},
{"t": "‘I hope a wild goose may not prove to be the end of our chase,’ observed Mr. Merryweather gloomily.", "sk": "I hope a wild goose may not prove to be the end of our chase, observed Mr. Merryweather gloomily.", "skk": "우리 추적의 끝이 헛수고로 밝혀지지 않길 바라요, 메리웨더 씨가 침울하게 말했다.", "ko": "\"'우리 추적의 끝이 헛수고로 판명되지 않기를 바랍니다,' 메리웨더 씨가 침울하게 말했습니다.\"", "c": [["‘I hope a wild goose may not prove to be the end of our chase,’", "바람", "'우리 추적의 끝이 헛수고로 판명되지 않기를 바랍니다,'", null], ["observed Mr. Merryweather gloomily.", "누가 어떻게 말했는지", "메리웨더 씨가 침울하게 말했습니다.", null]], "n": "a wild goose chase는 \"헛수고, 부질없는 추적\"을 뜻하는 관용 표현입니다. gloomily는 \"침울하게\"라는 뜻입니다."},
{"t": "‘You may place considerable confidence in Mr. Holmes, sir,’ said the police agent loftily.", "sk": "You may place considerable confidence in Mr. Holmes, sir, said the police agent loftily.", "skk": "홈즈 씨를 상당히 신뢰하셔도 됩니다, 경찰관이 거만하게 말했다.", "ko": "\"'홈즈 씨를 상당히 신뢰하셔도 됩니다,' 그 경찰 요원이 거만한 투로 말했습니다.\"", "c": [["‘You may place considerable confidence in Mr. Holmes, sir,’", "조언", "'홈즈 씨를 상당히 신뢰하셔도 됩니다,'", null], ["said the police agent loftily.", "누가 어떻게 말했는지", "그 경찰 요원이 거만한 투로 말했습니다.", null]], "n": "place confidence in ~는 \"~을 신뢰하다\"라는 뜻입니다. loftily는 \"거만하게\"라는 뜻입니다."},
{"t": "‘He has his own little methods, which are, if he won’t mind my saying so, just a little too theoretical and fantastic, but he has the makings of a detective in him.", "sk": "He has his own little methods, which are just a little too theoretical and fantastic, but he has the makings of a detective in him.", "skk": "그만의 방법이 있어요, 이런 말 해도 될지 모르겠지만 다소 지나치게 이론적이고 기발하죠, 그래도 그에겐 탐정으로서의 자질이 있어요.", "ko": "\"'그에게는 나름의 방법이 있죠, 이런 말씀을 드려도 될지 모르겠지만, 다소 지나치게 이론적이고 기발한 면이 있습니다, 하지만 그에게는 분명 탐정으로서의 자질이 있습니다.\"", "c": [["‘He has his own little methods", "주어+동사", "'그에게는 나름의 방법이 있죠", null], ["which are, if he won’t mind my saying so, just a little too theoretical and fantastic", "부연", "이런 말씀을 드려도 될지 모르겠지만, 다소 지나치게 이론적이고 기발한 면이 있습니다", "methods"], ["but he has the makings of a detective in him.", "그러나", "하지만 그에게는 분명 탐정으로서의 자질이 있습니다.", null]], "n": "the makings of ~는 \"~이 될 자질/소질\"이라는 뜻입니다."},
{"t": "It is not too much to say that once or twice, as in that business of the Sholto murder and the Agra treasure, he has been more nearly correct than the official force.’", "sk": "It is not too much to say that once or twice he has been more nearly correct than the official force.", "skk": "한두 번은, 숄토 살인 사건과 아그라 보물 사건에서처럼, 그가 정식 경찰보다 더 정확했다고 해도 과언이 아니에요.", "ko": "\"'한두 번은, 저 숄토 살인 사건과 아그라 보물 사건에서처럼, 그가 정식 경찰력보다도 더 정확했다고 해도 과언이 아닙니다.'\"", "c": [["It is not too much to say", "주어+동사", "'~라고 해도 과언이 아닙니다", null], ["that once or twice, as in that business of the Sholto murder and the Agra treasure, he has been more nearly correct than the official force.’", "무엇이 과언이 아닌지", "한두 번은, 저 숄토 살인 사건과 아그라 보물 사건에서처럼, 그가 정식 경찰력보다도 더 정확했다는 것이", "say"]], "n": "It is not too much to say that ~는 \"~라고 해도 과언이 아니다\"라는 뜻입니다."},
{"t": "‘Oh, if you say so, Mr. Jones, it is all right,’ said the stranger with deference.", "sk": "Oh, if you say so, Mr. Jones, it is all right, said the stranger with deference.", "skk": "아, 존스 씨가 그렇다면 괜찮겠죠, 낯선 남자가 정중하게 말했다.", "ko": "\"'아, 존스 씨께서 그렇게 말씀하신다면야 괜찮겠지요,' 그 낯선 남자가 정중하게 말했습니다.\"", "c": [["‘Oh, if you say so, Mr. Jones, it is all right,’", "수긍", "'아, 존스 씨께서 그렇게 말씀하신다면야 괜찮겠지요,'", null], ["said the stranger with deference.", "누가 어떻게 말했는지", "그 낯선 남자가 정중하게 말했습니다.", null]], "n": "deference는 \"경의, 존중\"이라는 뜻입니다."},
{"t": "‘Still, I confess that I miss my rubber.", "sk": "Still, I confess that I miss my rubber.", "skk": "그래도 카드 게임 한 판을 놓쳐서 아쉽네요.", "ko": "\"'그래도, 솔직히 말해 카드 게임 한 판을 놓치는 게 아쉽습니다.'\"", "c": [["‘Still, I confess that I miss my rubber.", "고백", "'그래도, 솔직히 말해 카드 게임 한 판을 놓치는 게 아쉽습니다.", null]], "n": "rubber는 여기서 브리지 같은 카드 게임의 \"한 판, 한 세트\"를 뜻합니다."},
{"t": "It is the first Saturday night for seven-and-twenty years that I have not had my rubber.’", "sk": "It is the first Saturday night for seven-and-twenty years that I have not had my rubber.", "skk": "27년 만에 카드 게임을 못 하는 첫 토요일 밤이거든요.", "ko": "\"'27년 만에 처음으로 카드 게임을 못 하는 토요일 밤이니까요.'\"", "c": [["It is the first Saturday night for seven-and-twenty years", "주어+동사", "'27년 만에 처음 맞는 토요일 밤입니다", null], ["that I have not had my rubber.’", "어떤 토요일 밤", "제가 카드 게임을 못 하는", "Saturday night"]], "n": "seven-and-twenty는 \"27\"을 뜻하는 옛날식 표현입니다(twenty-seven과 같음)."},
{"t": "‘I think you will find,’ said Sherlock Holmes, ‘that you will play for a higher stake to-night than you have ever done yet, and that the play will be more exciting.", "sk": "I think you will find, said Sherlock Holmes, that you will play for a higher stake to-night than you have ever done yet, and that the play will be more exciting.", "skk": "아마 알게 되실 거예요, 셜록 홈즈가 말했다, 오늘 밤엔 그 어느 때보다 큰 판돈을 걸고, 더 흥미진진한 게임을 하게 될 거라는 걸요.", "ko": "\"'아마 알게 되실 겁니다,' 셜록 홈즈가 말했습니다, '오늘 밤에는 지금까지 하신 그 어느 때보다도 큰 판돈을 걸고, 더 흥미진진한 게임을 하시게 될 거라는 걸 말이죠.'\"", "c": [["‘I think you will find,’ said Sherlock Holmes", "화자", "'아마 알게 되실 겁니다,' 셜록 홈즈가 말했습니다", null], ["‘that you will play for a higher stake to-night than you have ever done yet, and that the play will be more exciting.", "무엇을 알게 되는지", "오늘 밤에는 지금까지 하신 그 어느 때보다도 큰 판돈을 걸고, 더 흥미진진한 게임을 하시게 될 거라는 것을요.", "find"]], "n": "stake는 \"판돈, 걸려 있는 것\"이라는 뜻입니다."},
{"t": "For you, Mr. Merryweather, the stake will be some £30,000; and for you, Jones, it will be the man upon whom you wish to lay your hands.’", "sk": "For you, Mr. Merryweather, the stake will be some thirty thousand pounds; and for you, Jones, it will be the man upon whom you wish to lay your hands.", "skk": "메리웨더 씨, 당신에게는 판돈이 약 3만 파운드일 거고, 존스 씨, 당신에게는 잡고 싶어 하던 그 사람이겠죠.", "ko": "\"'메리웨더 씨, 당신에게 그 판돈은 약 3만 파운드가 될 것이고, 존스 씨, 당신에게 그것은 당신이 그토록 붙잡고 싶어 하던 바로 그 사람이 될 겁니다.'\"", "c": [["For you, Mr. Merryweather, the stake will be some £30,000", "누구에게 무엇 ①", "'메리웨더 씨, 당신에게 그 판돈은 약 3만 파운드가 될 것이고", null], ["and for you, Jones, it will be the man upon whom you wish to lay your hands.’", "누구에게 무엇 ②", "존스 씨, 당신에게 그것은 당신이 그토록 붙잡고 싶어 하던 바로 그 사람이 될 겁니다.'", null]], "n": "lay one’s hands upon ~은 \"~을 붙잡다, 손에 넣다\"라는 뜻입니다."},
{"t": "‘John Clay, the murderer, thief, smasher, and forger.", "sk": "John Clay, the murderer, thief, smasher, and forger.", "skk": "존 클레이, 살인자, 도둑, 위조지폐범, 문서위조범이죠.", "ko": "\"'존 클레이, 살인자이자 도둑, 위조지폐범이자 문서위조범입니다.'\"", "c": [["‘John Clay, the murderer, thief, smasher, and forger.", "소개", "'존 클레이, 살인자이자 도둑, 위조지폐범이자 문서위조범입니다.'", null]], "n": "smasher는 여기서 \"위조지폐범\"을, forger는 \"문서위조범\"을 뜻합니다."},
{"t": "He’s a young man, Mr. Merryweather, but he is at the head of his profession, and I would rather have my bracelets on him than on any criminal in London.", "sk": "He’s a young man, but he is at the head of his profession, and I would rather have my bracelets on him than on any criminal in London.", "skk": "젊은 사람이지만 자기 업계에서는 최고죠, 런던의 어떤 범죄자보다 이 사람에게 수갑을 채우고 싶어요.", "ko": "\"그는 젊은 사람입니다, 메리웨더 씨, 하지만 자기 업계에서는 최고에 올라 있는 자입니다, 런던의 그 어떤 범죄자보다도 이자에게 제 수갑을 채우고 싶습니다.\"", "c": [["He’s a young man, Mr. Merryweather", "소개", "그는 젊은 사람입니다, 메리웨더 씨", null], ["but he is at the head of his profession", "부연", "하지만 자기 업계에서는 최고에 올라 있는 자입니다", null], ["and I would rather have my bracelets on him than on any criminal in London.", "바람", "런던의 그 어떤 범죄자보다도 이자에게 제 수갑을 채우고 싶습니다.", null]], "n": "at the head of ~는 \"~에서 최고 자리에\"라는 뜻입니다. bracelets는 속어로 \"수갑\"을 뜻합니다."},
{"t": "He’s a remarkable man, is young John Clay.", "sk": "He’s a remarkable man, is young John Clay.", "skk": "대단한 사람이죠, 이 젊은 존 클레이가.", "ko": "\"대단한 사람이죠, 이 젊은 존 클레이라는 자는요.\"", "c": [["He’s a remarkable man, is young John Clay.", "주어+동사(도치)", "대단한 사람이죠, 이 젊은 존 클레이라는 자는요.", null]], "n": "He’s a remarkable man, is young John Clay는 강조를 위해 주어를 뒤로 보낸 도치 구문입니다(= Young John Clay is a remarkable man)."},
{"t": "His grandfather was a royal duke, and he himself has been to Eton and Oxford.", "sk": "His grandfather was a royal duke, and he himself has been to Eton and Oxford.", "skk": "그의 할아버지는 왕실 공작이었고, 본인은 이튼과 옥스퍼드를 나왔죠.", "ko": "\"그의 할아버지는 왕실 공작이었고, 그 자신은 이튼 학교와 옥스퍼드 대학을 다녔습니다.\"", "c": [["His grandfather was a royal duke", "주어+동사 ①", "그의 할아버지는 왕실 공작이었고", null], ["and he himself has been to Eton and Oxford.", "주어+동사 ②", "그 자신은 이튼 학교와 옥스퍼드 대학을 다녔습니다.", null]], "n": "Eton과 Oxford는 각각 영국의 명문 사립학교와 명문 대학을 가리킵니다."},
{"t": "His brain is as cunning as his fingers, and though we meet signs of him at every turn, we never know where to find the man himself.", "sk": "His brain is as cunning as his fingers, and though we meet signs of him at every turn, we never know where to find the man himself.", "skk": "머리는 손가락만큼이나 교활하고, 곳곳에서 그의 흔적을 만나지만 정작 그 사람 자체를 어디서 찾을지는 몰라요.", "ko": "\"그의 머리는 그의 손가락만큼이나 교활하고, 우리는 곳곳에서 그의 흔적을 마주치지만 정작 그 사람 자체를 어디서 찾아야 할지는 결코 알 수가 없습니다.\"", "c": [["His brain is as cunning as his fingers", "주어+동사", "그의 머리는 그의 손가락만큼이나 교활하고", null], ["and though we meet signs of him at every turn", "양보", "우리는 곳곳에서 그의 흔적을 마주치지만", null], ["we never know where to find the man himself.", "결론", "정작 그 사람 자체를 어디서 찾아야 할지는 결코 알 수가 없습니다.", null]], "n": "cunning은 \"교활한, 영리한\"이라는 뜻입니다. at every turn은 \"곳곳에서, 가는 곳마다\"라는 뜻입니다."},
{"t": "He’ll crack a crib in Scotland one week, and be raising money to build an orphanage in Cornwall the next.", "sk": "He’ll crack a crib in Scotland one week, and be raising money to build an orphanage in Cornwall the next.", "skk": "이번 주엔 스코틀랜드에서 집을 털고, 다음 주엔 콘월에서 고아원 짓는다고 돈을 모으죠.", "ko": "\"어떤 주에는 스코틀랜드에서 남의 집을 털다가, 그다음 주에는 콘월에서 고아원을 짓겠다며 돈을 모으고 다니는 자입니다.\"", "c": [["He’ll crack a crib in Scotland one week", "행동 ①", "어떤 주에는 스코틀랜드에서 남의 집을 털다가", null], ["and be raising money to build an orphanage in Cornwall the next.", "행동 ②", "그다음 주에는 콘월에서 고아원을 짓겠다며 돈을 모으고 다니는 자입니다.", null]], "n": "crack a crib는 속어로 \"남의 집을 털다\"라는 뜻입니다. orphanage는 \"고아원\"이라는 뜻입니다."},
{"t": "I’ve been on his track for years and have never set eyes on him yet.’", "sk": "I’ve been on his track for years and have never set eyes on him yet.", "skk": "몇 년째 그를 쫓고 있는데 아직 한 번도 직접 본 적이 없어요.", "ko": "\"'저는 몇 년째 그를 추적해왔지만 아직 그의 얼굴 한 번 직접 본 적이 없습니다.'\"", "c": [["I’ve been on his track for years", "주어+동사", "'저는 몇 년째 그를 추적해왔지만", null], ["and have never set eyes on him yet.’", "결과", "아직 그의 얼굴 한 번 직접 본 적이 없습니다.'", null]], "n": "be on someone’s track은 \"~를 추적 중이다\"라는 뜻입니다. set eyes on ~은 \"~를 직접 보다\"라는 뜻입니다."},
{"t": "‘I hope that I may have the pleasure of introducing you to-night.", "sk": "I hope that I may have the pleasure of introducing you to-night.", "skk": "오늘 밤 두 분을 소개하는 기쁨을 누릴 수 있길 바라요.", "ko": "\"'오늘 밤 그자를 두 분께 소개해드리는 기쁨을 누릴 수 있기를 바랍니다.'\"", "c": [["‘I hope that I may have the pleasure of introducing you to-night.", "바람", "'오늘 밤 그자를 두 분께 소개해드리는 기쁨을 누릴 수 있기를 바랍니다.", null]], "n": ""},
{"t": "I’ve had one or two little turns also with Mr. John Clay, and I agree with you that he is at the head of his profession.", "sk": "I’ve had one or two little turns also with Mr. John Clay, and I agree with you that he is at the head of his profession.", "skk": "저도 존 클레이 씨와 몇 번 얽힌 적이 있고, 그가 업계 최고라는 데 동의해요.", "ko": "\"저도 존 클레이 씨와 몇 차례 부딪친 적이 있고, 그가 자기 업계에서 최고 자리에 있다는 데 동의합니다.\"", "c": [["I’ve had one or two little turns also with Mr. John Clay", "주어+동사", "저도 존 클레이 씨와 몇 차례 부딪친 적이 있고", null], ["and I agree with you that he is at the head of his profession.", "동의", "그가 자기 업계에서 최고 자리에 있다는 데 동의합니다.", null]], "n": "have a turn with ~는 \"~와 한바탕 겪다, 부딪치다\"라는 뜻입니다."},
{"t": "It is past ten, however, and quite time that we started.", "sk": "It is past ten, however, and quite time that we started.", "skk": "하지만 벌써 10시가 넘었으니 이제 출발할 때예요.", "ko": "\"하지만 벌써 10시가 지났으니, 이제 우리가 출발할 때입니다.\"", "c": [["It is past ten, however", "상황", "하지만 벌써 10시가 지났으니", null], ["and quite time that we started.", "결론", "이제 우리가 출발할 때입니다.", null]], "n": ""}
],
"quiz":[
{"p":0,"q":"“…found him in deep conversation with a very stout, florid-faced, elderly gentleman with fiery red hair.”\n\n마지막 with fiery red hair는 누구를 꾸밀까요?",
 "o":["Holmes","the elderly gentleman","conversation","왓슨(I)"],"a":1,
 "e":"빨간 머리인 사람은 홈즈가 아니라 노신사입니다. 같은 with라도 첫 번째는 conversation에, 두 번째는 gentleman에 붙어요."},
{"p":1,"q":"“This gentleman, Mr. Wilson, has been my partner and helper…”\n\n이 문장의 뼈대는?",
 "o":["Mr. Wilson has been my partner and helper.","This gentleman has been my partner and helper.","This gentleman has been in many cases.","Mr. Wilson has been in my successful cases."],"a":1,
 "e":"주어는 This gentleman(왓슨)이고, Mr. Wilson은 홈즈가 부르고 있는 상대입니다."},
{"p":1,"q":"“I was afraid that you were engaged.” — “So I am.”\n\nSo I am의 뜻은?",
 "o":["나도 그렇다네.","그래, 정말 바쁘다네.","그래서 나는 가야겠네.","아니, 그렇지 않네."],"a":1,
 "e":"상대의 말이 사실임을 인정하는 대답입니다. 어순을 뒤집은 So am I가 \"나도 그렇다\"예요."},
{"p":1,"q":"“You will remember that I remarked the other day, …, that we must go to life itself.”\n\n두 번째 that절은 무엇의 내용일까요?",
 "o":["remember의 내용","remarked의 내용","the other day를 꾸밈","life itself를 꾸밈"],"a":1,
 "e":"첫 번째 that은 remember의 내용, 두 번째는 remarked의 내용입니다. 사이에 시간 설명이 길게 끼어들어 짝이 멀어졌을 뿐이에요."},
{"p":2,"q":"“…until your reason breaks down under them and acknowledges me to be right.”\n\nacknowledges의 주어는?",
 "o":["I","you","your reason","them"],"a":2,
 "e":"동사 끝의 -s가 단서입니다. you였다면 acknowledge가 되겠죠. 무너지는 것도, 인정하는 것도 자네의 이성입니다."},
{"p":2,"q":"“…a narrative which promises to be one of the most singular…”\n\n여기서 promises의 뜻은?",
 "o":["약속하다","~일 것 같다","기대하게 만들다는 약속을 받다","맹세하다"],"a":1,
 "e":"사물이 주어일 때 promise는 \"~일 듯하다\"는 예상입니다. 이야기가 약속을 할 수는 없으니까요."},
{"p":2,"q":"“…whether any positive crime has been committed.”\n\n여기서 positive의 뜻은?",
 "o":["긍정적인","적극적인","확실한, 명백한","양성의"],"a":2,
 "e":"아는 단어인데 뜻이 안 통할 때는 다른 뜻으로 쓰인 경우를 의심하세요. 여기서는 \"범죄라고 확실히 말할 수 있는\"입니다."},
{"p":3,"q":"“Our visitor bore every mark of being an average commonplace British tradesman…”\n\n여기서 bore의 뜻은?",
 "o":["낳았다","지니고 있었다","견뎌냈다","지루하게 만들었다"],"a":1,
 "e":"bore는 bear의 과거형입니다. 여기선 \"(어떤 표를) 지니고 있었다\"는 뜻이고, \"낳았다\"나 철자가 같은 다른 단어 bore(지루하게 하다)로 읽으면 엉뚱해집니다."},
{"p":3,"q":"“…there was nothing remarkable about the man save his blazing red head, and the expression of extreme chagrin and discontent upon his features.”\n\nsave 뒤에 걸리는 것은 몇 가지일까요?",
 "o":["한 가지: 빨간 머리만","두 가지: 빨간 머리와 표정","세 가지: 빨간 머리, 표정, 옷차림","아무것도 걸리지 않는다"],"a":1,
 "e":"save(=except) 뒤에 and로 이어진 두 가지, 빨간 머리와 표정이 함께 걸립니다. 콤마 때문에 하나만 걸리는 것처럼 보이기 쉬워요."},
{"p":3,"q":"“Beyond the obvious facts that he has… done manual labour, that he takes snuff, …, I can deduce nothing else.”\n\n이 문장의 진짜 주어와 동사는?",
 "o":["he has done manual labour","I can deduce nothing else","the obvious facts","that he takes snuff"],"a":1,
 "e":"that절 다섯 개는 모두 facts를 풀어 설명하는 덩어리일 뿐이고, 진짜 주어와 동사는 맨 뒤의 I can deduce nothing else입니다."},
{"p":4,"q":"“Your right hand is quite a size larger than your left. You have worked with it, and the muscles are more developed.”\n\n두 번째 문장의 it이 가리키는 것은?",
 "o":["왼손","오른손","근육","조합"],"a":1,
 "e":"it은 앞 문장에서 나온 your right hand(오른손)를 가리킵니다. 대명사는 항상 앞 문장에서 짝을 찾아야 해요."},
{"p":4,"q":"“That trick of staining the fishes' scales of a delicate pink is quite peculiar to China.”\n\n여기서 peculiar to의 뜻은?",
 "o":["~에게 이상한","~에만 있는, ~특유의","~를 싫어하는","~와 비슷한"],"a":1,
 "e":"peculiar to는 \"이상한\"이 아니라 \"그것에만 있는, 그것 특유의\"라는 뜻입니다. 중국에서만 쓰는 방식이라는 말이에요."},
{"p":4,"q":"“…by that right cuff so very shiny for five inches, and the left one with the smooth patch near the elbow…”\n\n여기서 one이 가리키는 것은?",
 "o":["hand","desk","cuff","elbow"],"a":2,
 "e":"one은 앞의 cuff를 대신하는 대명사입니다. 오른쪽 소맷부리(cuff) 이야기에 이어 왼쪽 소맷부리(the left one = the left cuff) 이야기를 하고 있어요."},
{"p":5,"q":"“Can you not find the advertisement, Mr. Wilson?”\n\n이 문장의 실제 의미에 가장 가까운 것은?",
 "o":["몇 번이나 찾아봤는데도 결국 못 찾았다는 뜻이다.","정중하게 찾아봐 달라고 부탁하는 말이다.","윌슨이 광고를 잃어버린 걸 홈즈가 질책하는 말이다.","광고가 애초에 존재하지 않는다는 뜻이다."],"a":1,
 "e":"Can you not ~?는 부정문처럼 보여도 실제로는 정중한 요청(\"~해 주시겠어요?\")입니다. 진짜 부정의 의미가 아닙니다."},
{"p":5,"q":"“…my poor little reputation… will suffer shipwreck if I am so candid.”\n\n여기서 suffer shipwreck는 무슨 뜻일까요?",
 "o":["실제로 배를 타다가 난파를 당한다.","명성이 완전히 결딴난다는 비유다.","솔직해지면 배멀미를 한다는 농담이다.","홈즈가 곧 항해를 떠난다는 암시다."],"a":1,
 "e":"suffer shipwreck는 문자 그대로 \"난파를 당하다\"지만, 여기서는 명성 같은 것이 \"완전히 결딴나다\"라는 비유로 쓰였습니다."},
{"p":5,"q":"광고문의 “the late Ezekiah Hopkins”에서 late의 뜻은?",
 "o":["최근에 나타난","늦게 도착한","이미 죽은, 고인이 된","마지막의"],"a":2,
 "e":"late가 사람 이름 앞에 오면 \"늦은\"이 아니라 \"고인이 된, 작고한\"이라는 뜻입니다."},
{"p":6,"q":"“It is a little off the beaten track, isn't it?”\n\noff the beaten track의 뜻은?",
 "o":["잘 알려진 길","흔치 않은, 색다른","위험한 지름길","지루한 이야기"],"a":1,
 "e":"off the beaten track는 \"다니는 길에서 벗어난\" → \"흔치 않은, 색다른\"이라는 관용구입니다."},
{"p":6,"q":"“What on earth does this mean?” I ejaculated…\n\n여기서 ejaculated의 뜻은?",
 "o":["소리쳐 말했다","화를 냈다","한숨을 쉬었다","웃음을 터뜨렸다"],"a":0,
 "e":"ejaculated는 요즘은 잘 안 쓰는 옛 표현으로, 그냥 \"소리쳐 말했다, 외쳤다\"는 뜻입니다."},
{"p":6,"q":"“…I would have a job to pay him but that he is willing to come for half wages…”\n\n여기서 but that의 뜻으로 가장 알맞은 것은?",
 "o":["그러나 그것은","만약 ~가 아니었다면","그것 말고는","~할 때까지"],"a":1,
 "e":"but that은 \"만약 ~가 아니었다면\"이라는 뜻으로, 앞의 가정(월급 주기 힘들었을 것)이 성립하지 않는 이유를 뒤에서 밝혀줍니다."},
{"p":7,"q":"“Never was such a fellow for photography.”\n\n이 문장이 Never로 시작하는 이유는?",
 "o":["명령문이라서","부정어가 앞에 나오면서 주어와 동사가 뒤집혔다","의문문이라서","단순히 강조를 위한 반복"],"a":1,
 "e":"부정어(Never)가 문장 맨 앞에 나오면 주어와 동사의 순서가 뒤집힙니다. 원래 순서는 There was never such a fellow입니다."},
{"p":7,"q":"“It is not a common experience among employers in this age.”\n\n여기서 age의 뜻은?",
 "o":["나이","시대","연령대","노년"],"a":1,
 "e":"age는 늘 \"나이\"만 뜻하지 않습니다. 여기서는 \"시대\"라는 뜻입니다."},
{"p":7,"q":"“...diving down into the cellar... to develop his pictures.”\n\n여기서 develop의 뜻은?",
 "o":["개발하다","(사진을) 현상하다","발전시키다","드러내다"],"a":1,
 "e":"카메라·사진 이야기 맥락이라 develop은 \"개발하다\"가 아니라 \"(필름을) 현상하다\"라는 뜻입니다."},
{"p":8,"q":"“‘Why that?’ I asks.”\n\nI asks는 왜 표준 문법(I ask)이 아닐까요?",
 "o":["원문에 오타가 있어서","윌슨의 말투를 그대로 살린 사투리 표현이라서","과거를 나타내는 특별한 문법이라서","홈즈를 흉내 내는 말이라서"],"a":1,
 "e":"윌슨이 자기가 겪은 일을 자기 말투 그대로 옮겨 이야기하고 있어서, 표준 문법이 아닌 I asks가 그대로 쓰였습니다."},
{"p":8,"q":"“...the trustees are at their wits' end what to do with the money.”\n\nat their wits' end의 뜻은?",
 "o":["아주 똑똑해서","머리를 다 써버려 어쩔 줄 모르는","화가 나서 참을 수 없는","돈이 다 떨어진"],"a":1,
 "e":"at one's wits' end는 \"머리를 다 써버려서 어쩔 줄 모르는\"이라는 관용구입니다."},
{"p":8,"q":"“...here's a nice little crib all ready for me to step into.”\n\n여기서 crib의 뜻은?",
 "o":["아기 침대","일자리, 자리","비밀 장소","작은 상자"],"a":1,
 "e":"crib는 원래 \"아기 침대, 구유\"지만 여기서는 구어체로 \"일자리, 자리\"를 뜻합니다."},
{"p":9,"q":"“...with instructions to apply the interest to the providing of easy berths to men whose hair is of that colour.”\n\n여기서 berths의 뜻은?",
 "o":["배의 정박 자리(원래 뜻 그대로)","편한 일자리","출생일","숙소, 침실"],"a":1,
 "e":"berth는 원래 \"배의 정박 자리\"지만, 여기서는 비유적으로 \"편한 일자리\"를 뜻합니다."},
{"p":9,"q":"“He was himself red-headed, and he had a great sympathy for all red-headed men; so, when he died, it was found that he had left his enormous fortune in the hands of trustees...”\n\n이 문장의 진짜 주어와 동사는?",
 "o":["he had a great sympathy","it was found","he had left his enormous fortune","when he died"],"a":1,
 "e":"it was found that ~는 \"~라는 게 밝혀졌다\"는 가주어 구문으로, 이 긴 문장 뒷부분의 진짜 뼈대입니다. that 뒤는 전부 무엇이 밝혀졌는지 풀어주는 내용입니다."},
{"p":9,"q":"“...he wanted to do the old town a good turn.”\n\ndo a good turn의 뜻은?",
 "o":["방향을 바꾸다","은혜를 베풀다","좋은 순서를 정하다","한 바퀴 돌다"],"a":1,
 "e":"do a good turn은 \"좋은 일을 해주다, 은혜를 베풀다\"라는 관용구입니다."},
{"p":10,"q":"“...every man who had a shade of red in his hair had tramped into the city...”\n\n여기서 shade의 뜻은?",
 "o":["그늘","색조, 색의 정도","그림자","커튼"],"a":1,
 "e":"shade는 여기서 \"그늘\"이 아니라 \"색조, 색의 종류\"라는 뜻입니다. a shade of red는 \"붉은 기\" 정도로 옮길 수 있습니다."},
{"p":10,"q":"“Fleet Street was choked with red-headed folk...”\n\nchoked with의 뜻으로 가장 알맞은 것은?",
 "o":["~로 숨이 막혀 죽은","~로 꽉 막힌, 발 디딜 틈 없이 붐비는","~를 목 졸라 죽인","~로 목이 쉰"],"a":1,
 "e":"choked with는 사람이 아니라 장소를 주어로 쓰여서 \"~로 꽉 막힌, 붐비는\"이라는 뜻을 나타냅니다."},
{"p":10,"q":"“How he did it I could not imagine, but he pushed and pulled and butted...”\n\n이 문장을 도치하기 전 원래 순서는?",
 "o":["I could not imagine how he did it.","He did it how I could not imagine.","It I could not imagine how he did.","How could not I imagine he did it."],"a":0,
 "e":"목적어 역할을 하는 how he did it을 문장 맨 앞으로 뺀 도치 구문입니다. 원래 순서는 I could not imagine how he did it입니다."},
{"p":11,"q":"“There was nothing in the office but a couple of wooden chairs and a deal table...”\n\nnothing ... but의 뜻은?",
 "o":["아무것도 아니지만","~ 말고는 아무것도 없다","결코 ~ 아니다","아무것도 없이는 안 된다"],"a":1,
 "e":"nothing ... but ~는 \"~ 말고는 아무것도 없다\"는 뜻입니다. 여기선 의자 두 개와 탁자 하나뿐이었다는 뜻이죠."},
{"p":11,"q":"“‘And he is admirably suited for it,’ the other answered.”\n\nadmirably suited의 뜻으로 가장 알맞은 것은?",
 "o":["감탄할 만큼 놀란","더할 나위 없이 적합한","존경스러울 만큼 정직한","놀랍도록 불편한"],"a":1,
 "e":"admirably suited for는 \"더할 나위 없이 적합한\"이라는 뜻입니다. admirably가 suited를 강조합니다."},
{"p":11,"q":"“I cannot recall when I have seen anything so fine.”\n\n여기서 recall의 품사와 뜻은?",
 "o":["명사 · 소환, 리콜","동사 · 기억해내다","명사 · 재시험","동사 · 되돌아가다"],"a":1,
 "e":"여기서 recall은 동사로 쓰여 \"기억해내다\"라는 뜻입니다. cannot recall은 \"기억이 안 난다\"는 뜻이죠."},
{"p":12,"q":"“...for we have twice been deceived by wigs and once by paint.”\n\n여기서 paint의 뜻으로 가장 알맞은 것은?",
 "o":["벽에 칠하는 페인트","가짜로 머리를 붉게 칠하는 화장품·안료","그림 물감 세트","페인트공"],"a":1,
 "e":"여기서 paint는 가짜로 머리를 빨갛게 칠해서 속이는 데 쓰는 화장품·안료를 가리킵니다. 앞의 wigs(가발)와 짝을 이루는 속임수 도구입니다."},
{"p":12,"q":"“You will, however, I am sure, excuse me for taking an obvious precaution.”\n\nexcuse me for ~ing의 뜻은?",
 "o":["~하는 것에 대해 변명하다","~하는 것을 양해해 주세요","~하는 것을 그만두세요","~한 것을 후회합니다"],"a":1,
 "e":"excuse me for ~ing는 \"~하는 것을 양해해 주세요\"라는 뜻입니다. excuse는 여기서 명사(변명)가 아니라 동사입니다."},
{"p":12,"q":"“...there was not a red-head to be seen except my own and that of the manager.”\n\n여기서 that이 가리키는 것은?",
 "o":["결원(vacancy)","매니저(manager) 그 사람","머리(hair)","창문(window)"],"a":2,
 "e":"that of the manager는 the hair of the manager를 뜻합니다. 앞에서 이미 나온 hair라는 단어의 반복을 피하려고 that으로 받은 것입니다."},
{"p": 13, "q": "“‘In the case of another,’ said he, ‘the objection might be fatal, but we must stretch a point in favour of a man with such a head of hair as yours.”\n\nstretch a point의 뜻은?", "o": ["엄격하게 규칙을 지키다", "규칙을 좀 봐주다, 예외를 두다", "요점을 강조하다", "이야기를 길게 늘이다"], "a": 1, "e": "stretch a point는 \"규칙을 좀 봐주다, 예외를 두다\"라는 뜻입니다. 윌슨의 머리색이 워낙 훌륭해서 독신이라는 결격 사유를 눈감아준다는 뜻이죠."},
{"p": 13, "q": "“The fund was, of course, for the propagation and spread of the red-heads as well as for their maintenance.”\n\nA as well as B의 뜻은?", "o": ["A보다는 B가", "B뿐 아니라 A도", "A이거나 B이거나", "A와 B 둘 다 아닌"], "a": 1, "e": "A as well as B는 \"B뿐 아니라 A도\"라는 뜻입니다. 여기서는 maintenance(존속)뿐 아니라 propagation and spread(번식과 확산)도 기금의 목적이라는 뜻입니다."},
{"p": 13, "q": "“It is exceedingly unfortunate that you should be a bachelor.”\n\n여기서 should의 쓰임으로 가장 알맞은 것은?", "o": ["미래의 일을 추측함", "놀라움·유감을 나타냄", "과거의 의무를 나타냄", "정중한 요청을 나타냄"], "a": 1, "e": "이 should는 감정을 나타내는 형용사(unfortunate) 뒤에서 놀라움이나 유감을 나타내는 용법으로, \"~라니\"에 가깝게 옮길 수 있습니다."},
{"p": 14, "q": "“‘Is purely nominal.’”\n\nnominal의 뜻은?", "o": ["명목상의", "이름이 없는", "숫자로 된", "공식적으로 등록된"], "a": 0, "e": "nominal은 \"명목상의\"라는 뜻입니다. purely nominal은 \"순전히 명목상일 뿐\"이라는 뜻이죠."},
{"p": 14, "q": "“You don’t comply with the conditions if you budge from the office during that time.”\n\ncomply with의 뜻은?", "o": ["~에 반대하다", "~을 준수하다, 따르다", "~을 무시하다", "~을 완성하다"], "a": 1, "e": "comply with는 \"~을 준수하다, 따르다\"라는 뜻입니다."},
{"p": 14, "q": "“If you leave, you forfeit your whole position forever.”\n\nforfeit의 뜻은?", "o": ["되찾다", "(규칙을 어겨서) 잃다, 몰수당하다", "보호하다", "연장하다"], "a": 1, "e": "forfeit은 \"(규칙을 어겨서) ~을 잃다, 몰수당하다\"라는 뜻입니다."},
{"p": 15, "q": "“‘No excuse will avail,’ said Mr. Duncan Ross”\n\navail의 뜻은?", "o": ["소용이 있다, 도움이 되다", "이용할 수 없다", "면제되다", "사과하다"], "a": 0, "e": "avail은 \"소용이 있다, 도움이 되다\"라는 뜻의 동사입니다. No excuse will avail은 \"어떤 변명도 소용없다\"는 뜻입니다."},
{"p": 15, "q": "“There is the first volume of it in that press.”\n\n여기서 press의 뜻은?", "o": ["인쇄기", "언론", "문 달린 장롱, 벽장", "압박"], "a": 2, "e": "여기서 press는 \"인쇄기\"가 아니라 옷장·찬장처럼 문이 달린 \"장롱, 벽장\"을 뜻하는 영국식 표현입니다."},
{"p": 15, "q": "“let me congratulate you once more on the important position which you have been fortunate enough to gain.”\n\ncongratulate A on B의 뜻은?", "o": ["A에게 B를 요청하다", "B에 대해 A를 축하하다", "A를 B로부터 보호하다", "A와 B를 비교하다"], "a": 1, "e": "congratulate A on B는 \"B에 대해 A를 축하하다\"라는 뜻입니다."},
{"p": 16, "q": "“It seemed altogether past belief that anyone could make such a will”\n\npast belief의 뜻은?", "o": ["과거의 신념", "믿기 어려운, 믿을 수 없는", "신념을 버린 상태", "확신에 찬"], "a": 1, "e": "past belief는 \"믿기 어려운, 믿을 수 없는\"이라는 뜻입니다."},
{"p": 16, "q": "“By degrees Mr. Duncan Ross took to coming in only once of a morning”\n\nby degrees의 뜻은?", "o": ["갑자기", "점차, 서서히", "정확한 온도로", "학위를 받아"], "a": 1, "e": "by degrees는 \"점차, 서서히\"라는 뜻입니다."},
{"p": 16, "q": "“on Saturday the manager came in and planked down four golden sovereigns for my week’s work.”\n\nsovereign의 뜻은?", "o": ["군주, 통치자", "1파운드짜리 옛 영국 금화", "은화 동전", "지폐 뭉치"], "a": 1, "e": "sovereign은 옛날 영국에서 쓰이던 1파운드짜리 금화입니다. 여기서는 군주가 아니라 화폐 단위로 쓰였습니다."},
{"p": 17, "q": "“the door was shut and locked, with a little square of cardboard hammered on to the middle of the panel with a tack.”\n\ntack의 뜻은?", "o": ["못", "압정", "나사", "자물쇠"], "a": 1, "e": "tack은 \"압정\"이라는 뜻입니다."},
{"p": 17, "q": "“Sherlock Holmes and I surveyed this curt announcement and the rueful face behind it”\n\ncurt와 rueful의 뜻으로 가장 알맞은 것은?", "o": ["친절한 · 기쁜", "짤막한(퉁명스러운) · 침울한", "긴 · 화난", "공식적인 · 무표정한"], "a": 1, "e": "curt는 \"짤막한, 퉁명스러운\"이라는 뜻이고, rueful은 \"침울한, 후회스러운\"이라는 뜻입니다."},
{"p": 17, "q": "“until the comical side of the affair so completely overtopped every other consideration that we both burst out into a roar of laughter.”\n\nburst out into a roar of laughter의 뜻은?", "o": ["울음을 터뜨리다", "한숨을 쉬다", "웃음을 터뜨리다", "소리를 지르다"], "a": 2, "e": "burst out into a roar of laughter는 \"웃음을 터뜨리다, 폭소를 터뜨리다\"라는 뜻입니다."},
{"p": 18, "q": "“‘I cannot see that there is anything very funny,’ cried our client, flushing up to the roots of his flaming head.”\n\nflushing up to의 뜻은?", "o": ["~까지 확 붉어지다", "~까지 차갑게 식다", "~까지 뛰어오르다", "~까지 흘러내리다"], "a": 0, "e": "flush up to ~는 \"~까지 확 붉어지다\"라는 뜻입니다. 윌슨이 무안해서 빨간 머리 뿌리까지 얼굴이 붉어졌다는 뜻이죠."},
{"p": 18, "q": "“Then, first, I went to the landlord, who is an accountant living on the ground floor”\n\nlandlord의 뜻은?", "o": ["세입자", "집주인", "회계 감사관", "경비원"], "a": 1, "e": "landlord는 \"집주인\"이라는 뜻입니다."},
{"p": 18, "q": "“He said that he had never heard of any such body.”\n\n여기서 body의 뜻은?", "o": ["몸, 신체", "시체", "단체, 조직", "본문"], "a": 2, "e": "여기서 body는 \"몸\"이 아니라 \"단체, 조직\"이라는 뜻입니다."},
{"p": 19, "q": "“He was a solicitor and was using my room as a temporary convenience until his new premises were ready.”\n\nsolicitor의 뜻은?", "o": ["(영국식) 사무 변호사", "해결사", "권유자", "중개인"], "a": 0, "e": "solicitor는 영국식 \"사무 변호사\"를 가리킵니다."},
{"p": 19, "q": "“…until his new premises were ready.”\n\npremises의 뜻은?", "o": ["전제, 가정", "(건물이 딸린) 부지, 사무실", "보험료", "약속"], "a": 1, "e": "premises는 \"(건물이 딸린) 부지, 사무실\"이라는 뜻으로 항상 복수형으로 씁니다."},
{"p": 19, "q": "“He did tell me the address.”\n\n이 문장에서 did가 하는 역할은?", "o": ["의문문을 만든다", "과거를 나타내는 조동사일 뿐이다", "동사를 강조한다", "부정문을 만든다"], "a": 2, "e": "평서문의 동사 앞에 did를 붙이면 \"정말로 ~했다\"는 강조의 뜻이 됩니다."},
{"p": 20, "q": "“…it was a manufactory of artificial knee-caps”\n\nmanufactory의 뜻은?", "o": ["제조 공장", "박물관", "창고", "실험실"], "a": 0, "e": "manufactory는 \"제조 공장\"이라는 뜻입니다."},
{"p": 20, "q": "“I did not wish to lose such a place without a struggle”\n\nwithout a struggle의 뜻은?", "o": ["힘들이지 않고 쉽게", "저항 한번 없이, 싸워보지도 않고", "투쟁 없이는 살 수 없어서", "고민할 필요도 없이"], "a": 1, "e": "without a struggle은 \"저항 한번 없이, 싸워보지도 않고\"라는 뜻입니다."},
{"p": 20, "q": "“…that graver issues hang from it than might at first sight appear.”\n\ngraver의 뜻은?", "o": ["무덤 파는 사람", "grave(심각한)의 비교급", "조각가", "더 가벼운"], "a": 1, "e": "graver는 grave(심각한)의 비교급으로, \"더 심각한\"이라는 뜻입니다."},
{"p": 21, "q": "“On the contrary, you are, as I understand, richer by some £30”\n\non the contrary의 뜻은?", "o": ["반면에도 불구하고", "오히려, 그와 반대로", "계약상으로는", "다행스럽게도"], "a": 1, "e": "on the contrary는 \"오히려, 그와 반대로\"라는 뜻입니다."},
{"p": 21, "q": "“I do not see that you have any grievance against this extraordinary league.”\n\ngrievance의 뜻은?", "o": ["불만, 불만 사유", "슬픔, 비탄", "이익, 혜택", "심각한 부상"], "a": 0, "e": "grievance는 \"불만, 불만 사유\"라는 뜻입니다."},
{"p": 21, "q": "“…what their object was in playing this prank—if it was a prank—upon me.”\n\nprank의 뜻은?", "o": ["직업, 일자리", "계략, 음모", "장난, 짓궂은 짓", "보상, 대가"], "a": 2, "e": "prank는 \"장난, 짓궂은 짓\"이라는 뜻입니다."},
{"p": 22, "q": "“Because he was handy and would come cheap.”\n\nhandy의 뜻은?", "o": ["손재주가 있는, 일 잘하는", "가까이 있는", "위험한", "불친절한"], "a": 0, "e": "handy는 \"손재주가 있는, 일 잘하는\"이라는 뜻입니다."},
{"p": 22, "q": "“Holmes sat up in his chair in considerable excitement.”\n\nsat up의 뜻으로 가장 알맞은 것은?", "o": ["잠에서 깼다", "앉은 자세에서 몸을 곧추세웠다", "자리에서 완전히 일어섰다", "의자에 등을 기댔다"], "a": 1, "e": "sit up은 \"(앉은 자세에서) 몸을 곧추세우다\"라는 뜻입니다."},
{"p": 22, "q": "“Have you ever observed that his ears are pierced for earrings?”\n\npierced for earrings의 뜻은?", "o": ["귀걸이로 장식된", "귀걸이를 하기 위해 뚫린", "귀걸이를 잃어버린", "귀걸이 모양을 한"], "a": 1, "e": "pierced for earrings는 \"귀걸이를 하기 위해 뚫린\"이라는 뜻입니다."},
{"p": 23, "q": "“‘Nothing to complain of, sir.’”\n\ncomplain의 뜻은?", "o": ["불평하다", "자랑하다", "설명하다", "부탁하다"], "a": 0, "e": "complain은 \"불평하다\"라는 뜻입니다."},
{"p": 23, "q": "“I hope that by Monday we may come to a conclusion.”\n\ncome to a conclusion의 뜻은?", "o": ["결론에 이르다", "여행을 떠나다", "마음을 바꾸다", "약속을 잡다"], "a": 0, "e": "come to a conclusion은 \"결론에 이르다\"라는 뜻입니다."},
{"p": 23, "q": "“‘It is a most mysterious business.’”\n\nmysterious의 뜻은?", "o": ["지루한", "이해할 수 없는, 불가사의한", "위험한", "흔한"], "a": 1, "e": "mysterious는 \"이해할 수 없는, 불가사의한\"이라는 뜻입니다."},
{"p": 24, "q": "“It is your commonplace, featureless crimes which are really puzzling…”\n\nfeatureless의 뜻은?", "o": ["특징 없는", "화려한", "오래된", "위험한"], "a": 0, "e": "featureless는 \"특징 없는\"이라는 뜻입니다."},
{"p": 24, "q": "“But I must be prompt over this matter.”\n\nprompt의 뜻으로 가장 알맞은 것은?", "o": ["느긋한", "신속한, 지체 없는", "조용한", "확신하는"], "a": 1, "e": "prompt는 \"신속한, 지체 없는\"이라는 뜻입니다."},
{"p": 24, "q": "“…he suddenly sprang out of his chair… and put his pipe down upon the mantelpiece.”\n\nmantelpiece의 뜻은?", "o": ["창턱", "벽난로 선반", "책상 서랍", "현관문"], "a": 1, "e": "mantelpiece는 \"벽난로 선반\"이라는 뜻입니다."},
{"p": 25, "q": "“It is introspective, and I want to introspect.”\n\nintrospective의 뜻은?", "o": ["시끄러운", "자기 성찰적인", "가벼운", "격정적인"], "a": 1, "e": "introspective는 \"자기 성찰적인\"이라는 뜻입니다."},
{"p": 25, "q": "“…where a lawn of weedy grass… made a hard fight against a smoke-laden and uncongenial atmosphere.”\n\nuncongenial의 뜻은?", "o": ["쾌적한", "신선한", "마음에 안 드는, 쾌적하지 않은", "익숙한"], "a": 2, "e": "uncongenial은 \"마음에 안 드는, 쾌적하지 않은\"이라는 뜻입니다."},
{"p": 25, "q": "“…having thumped vigorously upon the pavement with his stick…”\n\npavement의 뜻은?", "o": ["지붕", "보도, 인도(영국식 표현)", "담장", "계단"], "a": 1, "e": "pavement는 영국식 표현으로 \"보도, 인도\"를 뜻합니다."},
{"p": 26, "q": "“It was instantly opened by a bright-looking, clean-shaven young fellow…”\n\nclean-shaven의 뜻은?", "o": ["말끔히 면도한", "수염을 기른", "머리가 짧은", "안경을 쓴"], "a": 0, "e": "clean-shaven은 \"말끔히 면도한\"이라는 뜻입니다."},
{"p": 26, "q": "“…and for daring I am not sure that he has not a claim to be third.”\n\nclaim의 뜻으로 가장 알맞은 것은?", "o": ["불만", "권리, 자격", "질문", "제안"], "a": 1, "e": "여기서 claim은 \"권리, 자격\"이라는 뜻입니다."},
{"p": 26, "q": "“I am sure that you inquired your way merely in order that you might see him.”\n\ninquired의 뜻은?", "o": ["inquire(묻다)의 과거형", "invite(초대하다)의 과거형", "require(요구하다)의 과거형", "inspire(고무하다)의 과거형"], "a": 0, "e": "inquired는 \"묻다\"라는 뜻의 동사 inquire의 과거형입니다."},
{"p": 27, "q": "“We are spies in an enemy’s country.”\n\nspies의 뜻은?", "o": ["군인들", "spy(첩자)의 복수형", "여행자들", "상인들"], "a": 1, "e": "spies는 \"첩자\"라는 뜻의 spy의 복수형입니다."},
{"p": 27, "q": "“It was one of the main arteries which conveyed the traffic of the City…”\n\narteries의 뜻으로 가장 알맞은 것은?", "o": ["다리(교량)들", "간선도로들", "골목길들", "공원들"], "a": 1, "e": "artery는 원래 \"동맥\"이지만 여기서는 비유적으로 \"간선도로\"를 뜻합니다."},
{"p": 27, "q": "“…that they really abutted on the other side upon the faded and stagnant square which we had just quitted.”\n\nstagnant의 뜻은?", "o": ["활기찬", "정체된, 고여 있는", "화려한", "비어 있는"], "a": 1, "e": "stagnant는 \"정체된, 고여 있는\"이라는 뜻입니다."},
{"p": 28, "q": "“…and there are no red-headed clients to vex us with their conundrums.”\n\nconundrums의 뜻은?", "o": ["conundrum(수수께끼, 난제)의 복수형", "보상, 대가들", "불만들", "기회들"], "a": 0, "e": "conundrum은 \"수수께끼, 난제\"라는 뜻입니다."},
{"p": 28, "q": "“My friend was an enthusiastic musician…”\n\nenthusiastic의 뜻은?", "o": ["냉담한", "열정적인", "서투른", "유명한"], "a": 1, "e": "enthusiastic은 \"열정적인\"이라는 뜻입니다."},
{"p": 28, "q": "“…his gently smiling face and his languid, dreamy eyes…”\n\nlanguid의 뜻은?", "o": ["나른한", "날카로운", "슬픈", "놀란"], "a": 0, "e": "languid는 \"나른한\"이라는 뜻입니다."},
{"p": 29, "q": "“A considerable crime is in contemplation.”\n\nin contemplation의 뜻은?", "o": ["이미 끝난", "계획 중인, 검토 중인", "알려지지 않은", "취소된"], "a": 1, "e": "in contemplation은 \"계획 중인, 검토 중인\"이라는 뜻입니다."},
{"p": 29, "q": "“But to-day being Saturday rather complicates matters.”\n\ncomplicate의 뜻은?", "o": ["단순하게 만들다", "복잡하게 만들다", "해결하다", "연기하다"], "a": 1, "e": "complicate는 \"복잡하게 만들다\"라는 뜻입니다."},
{"p": 29, "q": "“…so kindly put your army revolver in your pocket.”\n\n이 문장에서 홈즈가 왓슨에게 요청한 것은?", "o": ["지팡이를 챙겨오라고", "리볼버(권총)를 챙겨오라고", "돈을 챙겨오라고", "우산을 챙겨오라고"], "a": 1, "e": "army revolver는 \"군용 리볼버(권총)\"를 뜻합니다."},
{"p": 30, "q": "“I trust that I am not more dense than my neighbours…”\n\n여기서 dense의 뜻은?", "o": ["빽빽한", "둔한, 눈치 없는", "무거운", "친절한"], "a": 1, "e": "dense는 여기서 \"둔한, 눈치 없는\"이라는 뜻입니다."},
{"p": 30, "q": "“…the whole business was still confused and grotesque.”\n\ngrotesque의 뜻은?", "o": ["기괴한", "단순한", "흥미로운", "친숙한"], "a": 0, "e": "grotesque는 \"기괴한\"이라는 뜻입니다."},
{"p": 30, "q": "“What was this nocturnal expedition, and why should I go armed?”\n\nnocturnal의 뜻은?", "o": ["짧은", "밤의, 야간의", "위험한", "비밀스러운"], "a": 1, "e": "nocturnal은 \"밤의, 야간의\"라는 뜻입니다."},
{"p": 31, "q": "“‘We’re hunting in couples again, Doctor, you see,’ said Jones in his consequential way.”\n\nconsequential의 뜻으로 가장 알맞은 것은?", "o": ["소심한", "거들먹거리는, 자기가 중요한 듯 구는", "슬픈", "무관심한"], "a": 1, "e": "consequential은 여기서 \"거들먹거리는, 자기가 중요한 듯 구는\"이라는 뜻입니다."},
{"p": 31, "q": "“‘I hope a wild goose may not prove to be the end of our chase,’ observed Mr. Merryweather gloomily.”\n\na wild goose chase의 뜻은?", "o": ["즐거운 나들이", "헛수고, 부질없는 추적", "긴 여행", "위험한 모험"], "a": 1, "e": "a wild goose chase는 \"헛수고, 부질없는 추적\"을 뜻하는 관용 표현입니다."},
{"p": 31, "q": "“‘You may place considerable confidence in Mr. Holmes, sir,’ said the police agent loftily.”\n\nloftily의 뜻은?", "o": ["다정하게", "거만하게", "조용하게", "급하게"], "a": 1, "e": "loftily는 \"거만하게\"라는 뜻입니다."},
{"p": 32, "q": "“‘Still, I confess that I miss my rubber.’”\n\n여기서 rubber의 뜻은?", "o": ["지우개", "(카드 게임의) 한 판, 한 세트", "고무 재질", "비옷"], "a": 1, "e": "rubber는 여기서 브리지 같은 카드 게임의 \"한 판, 한 세트\"를 뜻합니다."},
{"p": 32, "q": "“For you, Mr. Merryweather, the stake will be some £30,000…”\n\nstake의 뜻은?", "o": ["증거", "판돈, 걸려 있는 것", "일정", "약속"], "a": 1, "e": "stake는 \"판돈, 걸려 있는 것\"이라는 뜻입니다."},
{"p": 32, "q": "“John Clay, the murderer, thief, smasher, and forger.”\n\n여기서 smasher의 뜻은?", "o": ["운동선수", "위조지폐범", "건축가", "경찰관"], "a": 1, "e": "smasher는 여기서 \"위조지폐범\"이라는 뜻입니다."}
]
}
</script>

<script>
(function(){
var DATA=JSON.parse(document.getElementById('data').textContent);
var SENT=DATA.sentences, PASS=DATA.passages, DICT=DATA.dict, QUIZ=DATA.quiz;
var TOK=SENT.map(function(s){return s.t.split(/(\s+)/)});
var view=document.getElementById('view');
var tabRead=document.getElementById('tabRead'), tabSkel=document.getElementById('tabSkel'), tabQuiz=document.getElementById('tabQuiz');

var st={p:0,seen:0,tab:'read'};
try{var raw=localStorage.getItem('rhl');if(raw){var o=JSON.parse(raw);st.p=o.p||0;st.seen=o.seen||0}}catch(e){}
function save(){try{localStorage.setItem('rhl',JSON.stringify({p:st.p,seen:st.seen}))}catch(e){}}

function cw(w){return w.replace(/[^A-Za-z'-]/g,'').toLowerCase()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function range(si,ph){
  var pw=ph.split(/\s+/).map(cw).filter(Boolean),tk=TOK[si],out=[],ids=[];
  for(var i=0;i<tk.length;i++)if(cw(tk[i]))ids.push(i);
  for(var a=0;a+pw.length<=ids.length;a++){
    var ok=true;
    for(var b=0;b<pw.length;b++)if(cw(tk[ids[a+b]])!==pw[b]){ok=false;break}
    if(ok){for(var b2=0;b2<pw.length;b2++)out.push(ids[a+b2]);return out}
  }
  return out;
}
/* 뼈대(sk)와 원문(t)을 단어 단위로 정렬(LCS)해서, 원문 중 뼈대에 해당하는 토큰 인덱스를 찾는다 */
function skeletonHits(t,sk){
  var tTok=t.split(/(\s+)/),tIdx=[],tWords=[];
  for(var i=0;i<tTok.length;i++){var w=cw(tTok[i]);if(w){tIdx.push(i);tWords.push(w)}}
  var skWords=sk.split(/\s+/).map(cw).filter(Boolean);
  var n=tWords.length,m=skWords.length,dp=[];
  for(var a=0;a<=n;a++){dp.push(new Array(m+1).fill(0))}
  for(var a2=1;a2<=n;a2++)for(var b=1;b<=m;b++){
    dp[a2][b]=(tWords[a2-1]===skWords[b-1])?dp[a2-1][b-1]+1:Math.max(dp[a2-1][b],dp[a2][b-1]);
  }
  var hits={},x=n,y=m;
  while(x>0&&y>0){
    if(tWords[x-1]===skWords[y-1]){hits[tIdx[x-1]]=true;x--;y--}
    else if(dp[x-1][y]>=dp[x][y-1])x--; else y--;
  }
  return {tok:tTok,hits:hits};
}

/* ---------- 읽기 ---------- */
var ws=null,wi=null,openStr=false,chSel=null;
function readView(){
  var pg=PASS[st.p];
  var h='<div class="meta"><span>'+esc(pg.title)+'</span><span>'+(st.p+1)+' / '+PASS.length+'</span></div>';
  h+='<div id="text"></div>';
  h+='<div class="pager"><button id="prev">‹ 앞으로</button><button id="next">뒤로 ›</button></div>';
  h+='<div id="panel" style="margin-top:.8rem"></div>';
  view.innerHTML=h;
  document.getElementById('prev').disabled=st.p===0;
  document.getElementById('next').disabled=st.p===PASS.length-1;
  document.getElementById('prev').onclick=function(){st.p--;ws=null;openStr=false;chSel=null;save();readView()};
  document.getElementById('next').onclick=function(){st.p++;if(st.p>st.seen)st.seen=st.p;ws=null;openStr=false;chSel=null;save();readView()};
  document.getElementById('text').addEventListener('click',function(e){
    var t=e.target.closest('[data-i]');if(!t)return;
    var si=+t.getAttribute('data-s'),i=+t.getAttribute('data-i');
    if(ws===si&&wi===i){ws=null;wi=null;openStr=false;chSel=null}
    else{if(ws!==si)openStr=false;ws=si;wi=i;chSel=null}
    drawText();drawPanel();
  });
  drawText();drawPanel();
}
function drawText(){
  var pg=PASS[st.p],h='';
  for(var p=0;p<pg.paras.length;p++){
    h+='<p>';
    for(var q=0;q<pg.paras[p].length;q++){
      var si=pg.paras[p][q];
      var hi=(openStr&&ws===si&&chSel!==null&&SENT[si].c[chSel][3])?range(si,SENT[si].c[chSel][3]):[];
      h+='<span class="'+(openStr&&ws===si?'open':'')+'">';
      for(var i=0;i<TOK[si].length;i++){
        var tk=TOK[si][i];
        if(!cw(tk)){h+=esc(tk);continue}
        var cls='w'+(ws===si&&wi===i?' sel':(hi.indexOf(i)>=0?' tie':''));
        h+='<span class="'+cls+'" data-s="'+si+'" data-i="'+i+'">'+esc(tk)+'</span>';
      }
      h+='</span> ';
    }
    h+='</p>';
  }
  document.getElementById('text').innerHTML=h;
}
function drawPanel(){
  var panel=document.getElementById('panel');
  if(ws===null){panel.innerHTML='<p class="hint">모르는 단어를 탭하세요</p>';return}
  var w=cw(TOK[ws][wi]),d=DICT[w],h='<div class="card">';
  h+='<div class="word">'+esc(w)+(d&&d[2]?'<span class="ipa">/'+esc(d[2])+'/</span>':'')+'</div>';
  if(d)h+='<div class="gloss"><span class="pos">'+d[0]+'</span>'+esc(d[1])+'</div>';
  else h+='<div class="gloss" style="color:#6b7078">사전에 없는 기본 단어예요</div>';
  h+='<button class="full" id="sb">'+(openStr?'구조 접기':'이 문장 구조 보기')+'</button>';
  if(openStr){
    var s=SENT[ws];
    h+='<div class="sec"><div class="lab">뼈대</div><div class="skel">'+esc(s.sk)+'</div><div class="skelko">'+esc(s.skk)+'</div></div>';
    h+='<div class="sec">';
    for(var k=0;k<s.c.length;k++){
      var c=s.c[k];
      h+='<div class="chunk'+(c[3]?' tap':'')+(chSel===k?' on':'')+'" data-c="'+k+'">';
      h+='<div class="en">'+esc(c[0])+'</div>';
      h+='<div class="role">'+esc(c[1])+(c[3]?' → '+esc(c[3]):'')+'</div>';
      h+='<div class="kr">'+esc(c[2])+'</div></div>';
    }
    h+='</div>';
    if(s.n)h+='<div class="sec note">'+esc(s.n)+'</div>';
    h+='<div class="sec trans">'+esc(s.ko)+'</div>';
  }
  h+='</div>';
  panel.innerHTML=h;
  document.getElementById('sb').onclick=function(){openStr=!openStr;chSel=null;drawText();drawPanel()};
  Array.prototype.forEach.call(panel.querySelectorAll('[data-c]'),function(el){
    el.onclick=function(){
      var k=+el.getAttribute('data-c');
      if(!SENT[ws].c[k][3])return;
      chSel=(chSel===k)?null:k;drawText();drawPanel();
    };
  });
}

/* ---------- 뼈대 ---------- */
var skOpen={};
function skelView(){
  var pg=PASS[st.p],h='<div class="meta"><span>'+esc(pg.title)+'</span><span>'+(st.p+1)+' / '+PASS.length+'</span></div>';
  var ids=[];
  for(var a=0;a<pg.paras.length;a++)for(var b=0;b<pg.paras[a].length;b++)ids.push(pg.paras[a][b]);
  for(var i=0;i<ids.length;i++){
    var si=ids[i],s=SENT[si],open=!!skOpen[si];
    h+='<div class="skrow" data-si="'+si+'"><span class="arrow">'+(open?'▾ 접기':'▸ 펼치기')+'</span>';
    h+='<div class="sk">'+esc(s.sk)+'</div>';
    if(open){
      var m=skeletonHits(s.t,s.sk),oh='';
      for(var oi=0;oi<m.tok.length;oi++){
        var otk=m.tok[oi];
        oh+=(!cw(otk))?esc(otk):(m.hits[oi]?'<b class="skhit">'+esc(otk)+'</b>':esc(otk));
      }
      h+='<div class="orig">'+oh+'</div>';
      if(s.n)h+='<div class="note" style="margin-top:.55rem">'+esc(s.n)+'</div>';
    }
    h+='</div>';
  }
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll('.skrow'),function(el){
    el.addEventListener('click',function(){
      var si=+el.getAttribute('data-si');
      skOpen[si]=!skOpen[si];
      skelView();
    });
  });
}

/* ---------- 복습 ---------- */
var pool=[],qi=0,score=0,answered=false;
function startQuiz(){
  pool=QUIZ.filter(function(q){return q.p<=st.seen});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  qi=0;score=0;answered=false;quizView();
}
function quizView(){
  if(!pool.length){view.innerHTML='<p class="hint">아직 읽은 대목이 없습니다.<br>읽기 탭에서 한 대목을 읽고 오세요.</p>';return}
  if(qi>=pool.length){
    view.innerHTML='<div class="card"><div class="word">'+score+' / '+pool.length+'</div>'
      +'<div class="gloss">틀린 문제는 다시 읽어보면 오래 남습니다.</div>'
      +'<button class="full" id="again">다시 풀기</button></div>';
    document.getElementById('again').onclick=startQuiz;return;
  }
  var q=pool[qi],h='<div class="meta"><span>복습</span><span>'+(qi+1)+' / '+pool.length+'</span></div>';
  h+='<div class="card"><div class="q">'+esc(q.q).replace(/\n/g,'<br>')+'</div><div id="opts">';
  for(var i=0;i<q.o.length;i++)h+='<button class="opt" data-o="'+i+'">'+esc(q.o[i])+'</button>';
  h+='</div><div id="fb"></div></div>';
  view.innerHTML=h;answered=false;
  Array.prototype.forEach.call(document.querySelectorAll('[data-o]'),function(el){
    el.onclick=function(){
      if(answered)return;answered=true;
      var pick=+el.getAttribute('data-o'),q2=pool[qi];
      var btns=document.querySelectorAll('[data-o]');
      btns[q2.a].className='opt right';
      if(pick!==q2.a)btns[pick].className='opt wrong'; else score++;
      document.getElementById('fb').innerHTML='<div class="verdict">'+(pick===q2.a?'맞았습니다.':'아쉽네요.')+'</div>'
        +'<div class="note" style="margin-top:.3rem">'+esc(q2.e)+'</div>'
        +'<button class="full" id="nx">'+(qi===pool.length-1?'결과 보기':'다음 문제')+'</button>';
      document.getElementById('nx').onclick=function(){qi++;quizView()};
    };
  });
}

/* ---------- 탭 ---------- */
function setTab(t){
  st.tab=t;
  tabRead.setAttribute('aria-selected',t==='read');
  tabSkel.setAttribute('aria-selected',t==='skel');
  tabQuiz.setAttribute('aria-selected',t==='quiz');
  if(t==='read')readView(); else if(t==='skel')skelView(); else startQuiz();
}
tabRead.onclick=function(){setTab('read')};
tabSkel.onclick=function(){setTab('skel')};
tabQuiz.onclick=function(){setTab('quiz')};
setTab('read');
})();
</script>
</body>
