{"t": "My face lengthened at this, Mr. Holmes, for I thought that I was not to have the vacancy after all; but after thinking it over for a few minutes he said that it would be all right.", "sk": "My face lengthened at this, for I thought that I was not to have the vacancy after all; but he said that it would be all right.", "skk": "이 말에 제 얼굴이 길어졌습니다, 결국 결원 자리를 못 얻는구나 싶었거든요, 하지만 그는 괜찮을 거라고 말했습니다.", "ko": "\"이 말에 제 얼굴이 울상이 됐습니다, 홈즈 씨, 결국 그 자리를 얻지 못하는구나 싶었으니까요, 하지만 몇 분간 생각해보더니 그가 괜찮을 거라고 말했습니다.\"", "c": [["My face lengthened at this, Mr. Holmes", "주어+동사", "이 말에 제 얼굴이 울상이 됐습니다, 홈즈 씨", null], ["for I thought that I was not to have the vacancy after all", "이유", "결국 그 자리를 못 얻는구나 싶었으니까요", null], ["but after thinking it over for a few minutes he said that it would be all right", "반전", "하지만 몇 분간 생각해보더니 그는 괜찮을 거라고 말했습니다", null]], "n": "lengthened는 \"길어지다\"라는 뜻인데, 얼굴이 길어졌다는 것은 우리말의 \"울상이 되다\"에 해당합니다."},
{"t": "‘In the case of another,’ said he, ‘the objection might be fatal, but we must stretch a point in favour of a man with such a head of hair as yours.", "sk": "In the case of another, the objection might be fatal, but we must stretch a point in favour of a man with such a head of hair as yours.", "skk": "다른 사람의 경우라면, 그 문제가 치명적일 수도 있지만, 당신 같은 머리를 가진 사람을 위해서는 규칙을 좀 봐줘야겠지요.", "ko": "\"'다른 사람의 경우였다면,' 그가 말했습니다, '그 반대 사유가 치명적이었을지도 모릅니다, 하지만 당신처럼 그런 머리를 가진 분을 위해서는 저희가 규칙을 좀 봐드려야겠지요.'\"", "c": [["‘In the case of another,’ said he", "조건+화자", "'다른 사람의 경우였다면,' 그가 말했습니다", null], ["‘the objection might be fatal", "결과", "'그 반대 사유가 치명적이었을지도 모릅니다", null], ["but we must stretch a point in favour of a man with such a head of hair as yours", "반전 · 예외", "하지만 당신처럼 그런 머리를 가진 분을 위해서는 저희가 규칙을 좀 봐드려야겠지요", null]], "n": "stretch a point는 \"규칙을 좀 봐주다, 예외를 두다\"라는 관용구입니다. in favour of는 \"~를 위해, ~에 유리하게\"라는 뜻입니다."},

{"t": "Now a pawnbroker’s business is mostly done of an evening, Mr. Holmes, especially Thursday and Friday evening, which is just before pay-day; so it would suit me very well to earn a little in the mornings.", "sk": "A pawnbroker’s business is mostly done of an evening, especially before pay-day; so it would suit me very well to earn a little in the mornings.", "skk": "전당포 업은 대개 저녁에 이루어지는데, 특히 월급날 직전에 그러니, 아침에 조금 버는 게 저한테 잘 맞겠죠.", "ko": "\"전당포 업이라는 게 대개 저녁에, 특히 월급날 직전인 목요일과 금요일 저녁에 이루어지는지라, 홈즈 씨, 아침 시간에 조금이나마 버는 게 저한테는 아주 잘 맞을 것 같았습니다.\"", "c": [["Now a pawnbroker’s business is mostly done of an evening, Mr. Holmes", "주어+동사", "전당포 업은 대개 저녁에 이루어지는데요, 홈즈 씨", null], ["especially Thursday and Friday evening, which is just before pay-day", "보충 설명", "특히 월급날 바로 전인 목요일과 금요일 저녁에요", null], ["so it would suit me very well to earn a little in the mornings", "결과", "그러니 아침에 조금 버는 게 저한테 아주 잘 맞을 것 같았습니다", null]], "n": "of an evening은 \"저녁마다, 저녁에는\"이라는 뜻의 오래된 표현입니다. suit는 \"~에게 맞다, 어울리다\"라는 뜻입니다."},
{"t": "Besides, I knew that my assistant was a good man, and that he would see to anything that turned up.", "sk": "Besides, I knew that my assistant was a good man, and that he would see to anything that turned up.", "skk": "게다가 저는 제 조수가 좋은 사람이고, 무슨 일이 생기든 그가 처리해줄 거란 걸 알고 있었습니다.", "ko": "\"게다가 저는 제 조수가 좋은 사람이고, 무슨 일이 생기든 그가 알아서 처리해줄 거라는 걸 알고 있었습니다.\"", "c": [["Besides, I knew", "덧붙임+주어동사", "게다가 저는 알고 있었습니다", null], ["that my assistant was a good man", "무엇을 알았는지 ①", "제 조수가 좋은 사람이라는 것을", "knew"], ["and that he would see to anything that turned up", "무엇을 알았는지 ②", "그리고 무슨 일이 생기든 그가 처리해줄 거라는 것을", "knew"]], "n": "see to는 \"~을 처리하다, 돌보다\"라는 뜻입니다. turn up은 \"(일이) 생기다, 나타나다\"라는 뜻입니다."},

{"t": "‘No excuse will avail,’ said Mr. Duncan Ross; ‘neither sickness nor business nor anything else.", "sk": "No excuse will avail, said Mr. Duncan Ross; neither sickness nor business nor anything else.", "skk": "어떤 변명도 소용없습니다, 던컨 로스가 말했다; 병도, 사업도, 그 무엇도요.", "ko": "\"'어떤 변명도 소용없습니다,' 던컨 로스 씨가 말했습니다, '병도, 사업도, 그 무엇도 안 됩니다.'\"", "c": [["‘No excuse will avail,’ said Mr. Duncan Ross", "주어+동사+화자", "'어떤 변명도 소용없습니다,' 던컨 로스 씨가 말했습니다", null], ["‘neither sickness nor business nor anything else", "열거", "'병도, 사업도, 그 무엇도 안 됩니다", null]], "n": "avail은 \"소용이 있다, 도움이 되다\"라는 뜻의 동사입니다. neither A nor B nor C는 \"A도 B도 C도 아니다\"라는 뜻입니다."},

{"t": "‘Then, good-bye, Mr. Jabez Wilson, and let me congratulate you once more on the important position which you have been fortunate enough to gain.’", "sk": "Then, good-bye, Mr. Jabez Wilson, and let me congratulate you on the important position which you have been fortunate enough to gain.", "skk": "그럼 안녕히 가세요, 제이비즈 윌슨 씨, 운 좋게 얻으신 이 중요한 자리를 다시 한 번 축하드립니다.", "ko": "\"'그럼 안녕히 가십시오, 제이비즈 윌슨 씨, 운 좋게도 얻으신 이 중요한 자리를 다시 한번 축하드립니다.'\"", "c": [["‘Then, good-bye, Mr. Jabez Wilson", "작별", "'그럼 안녕히 가십시오, 제이비즈 윌슨 씨", null], ["and let me congratulate you once more on the important position", "축하", "다시 한번 이 중요한 자리를 축하드립니다", null], ["which you have been fortunate enough to gain", "앞 명사(position)를 꾸밈", "운 좋게도 얻게 되신", "position"]], "n": "congratulate A on B는 \"B에 대해 A를 축하하다\"라는 뜻입니다. fortunate enough to ~는 \"운 좋게도 ~하게 되다\"라는 뜻입니다."},
{"t": "He bowed me out of the room and I went home with my assistant, hardly knowing what to say or do, I was so pleased at my own good fortune.", "sk": "He bowed me out of the room and I went home with my assistant, hardly knowing what to say or do, I was so pleased at my own good fortune.", "skk": "그는 저를 배웅했고 저는 조수와 집으로 갔습니다, 무슨 말이나 행동을 해야 할지 거의 모른 채, 제 행운이 너무 기뻤거든요.", "ko": "\"그는 저를 방 밖으로 배웅해줬고, 저는 제 조수와 함께 집으로 갔는데, 제 행운이 너무 기쁜 나머지 무슨 말이나 행동을 해야 할지 거의 몰랐습니다.\"", "c": [["He bowed me out of the room", "동사 ①", "그는 저를 방 밖으로 배웅해줬습니다", null], ["and I went home with my assistant", "동사 ②", "그리고 저는 제 조수와 함께 집으로 갔습니다", null], ["hardly knowing what to say or do", "동시 상황", "무슨 말이나 행동을 해야 할지 거의 모른 채", null], ["I was so pleased at my own good fortune", "이유", "제 행운이 너무 기뻤으니까요", null]], "n": "bow someone out은 \"인사하며 배웅하다\"라는 뜻입니다. hardly knowing ~은 \"~을 거의 모른 채\"라는 분사구문입니다."},
{"t": "Well, I thought over the matter all day, and by evening I was in low spirits again; for I had quite persuaded myself that the whole affair must be some great hoax or fraud, though what its object might be I could not imagine.", "sk": "I thought over the matter all day, and by evening I was in low spirits again; for I had persuaded myself that the whole affair must be some great hoax or fraud.", "skk": "저는 하루 종일 그 일을 곱씹었고, 저녁이 되자 다시 우울해졌습니다, 이 모든 일이 큰 사기극이 틀림없다고 확신했거든요.", "ko": "\"저는 하루 종일 그 일을 곱씹었고, 저녁이 되자 다시 기분이 가라앉았습니다, 이 모든 일이 어떤 대단한 사기극이나 협잡이 틀림없다고 스스로 완전히 믿어버렸으니까요, 그 목적이 뭔지는 상상도 안 갔지만요.\"", "c": [["Well, I thought over the matter all day", "동사 ①", "저는 하루 종일 그 일을 곱씹었습니다", null], ["and by evening I was in low spirits again", "동사 ② · 결과", "그리고 저녁이 되자 다시 기분이 가라앉았습니다", null], ["for I had quite persuaded myself that the whole affair must be some great hoax or fraud", "이유", "이 모든 일이 대단한 사기극이나 협잡이 틀림없다고 스스로 완전히 믿어버렸으니까요", null], ["though what its object might be I could not imagine", "양보", "그 목적이 뭔지는 상상도 안 갔지만요", null]], "n": "persuade oneself that ~는 \"~라고 스스로를 납득시키다, 믿어버리다\"라는 뜻입니다. hoax와 fraud는 둘 다 \"사기, 속임수\"를 뜻하는 비슷한 말입니다."},
{"t": "It seemed altogether past belief that anyone could make such a will, or that they would pay such a sum for doing anything so simple as copying out the Encyclopædia Britannica.", "sk": "It seemed altogether past belief that anyone could make such a will, or that they would pay such a sum for doing anything so simple as copying out the Encyclopædia Britannica.", "skk": "누군가 그런 유언장을 만들 수 있다는 것도, 백과사전을 옮겨 적는 이런 간단한 일에 그런 큰돈을 지불한다는 것도 도무지 믿기지 않는 일 같았습니다.", "ko": "\"누군가 그런 유언장을 만들 수 있다는 것도, 백과사전을 옮겨 적는 것처럼 그렇게 간단한 일에 그런 큰돈을 지불한다는 것도 도무지 믿을 수 없는 일 같았습니다.\"", "c": [["It seemed altogether past belief", "가주어+동사", "도무지 믿을 수 없는 일 같았습니다", null], ["that anyone could make such a will", "진주어 ①", "누군가 그런 유언장을 만들 수 있다는 것도", "belief"], ["or that they would pay such a sum for doing anything so simple as copying out the Encyclopædia Britannica", "진주어 ②", "백과사전을 옮겨 적는 것처럼 간단한 일에 그런 큰돈을 지불한다는 것도", "belief"]], "n": "past belief는 \"믿기 어려운, 믿을 수 없는\"이라는 뜻입니다."},
{"t": "Vincent Spaulding did what he could to cheer me up, but by bedtime I had reasoned myself out of the whole thing.", "sk": "Vincent Spaulding did what he could to cheer me up, but by bedtime I had reasoned myself out of the whole thing.", "skk": "빈센트 스폴딩이 저를 기운 나게 하려고 할 수 있는 걸 다 했지만, 잘 시간쯤엔 제가 스스로 그 일을 다 그만두기로 결론 내렸습니다.", "ko": "\"빈센트 스폴딩이 저를 기운 나게 해주려고 할 수 있는 건 다 했지만, 잠자리에 들 무렵엔 저 스스로 이 일 전체를 없던 일로 치부하고 있었습니다.\"", "c": [["Vincent Spaulding did what he could to cheer me up", "동사 ①", "빈센트 스폴딩이 저를 기운 나게 해주려고 할 수 있는 건 다 했습니다", null], ["but by bedtime I had reasoned myself out of the whole thing", "반전", "하지만 잠자리에 들 무렵엔 저 스스로 이 일 전체를 없던 일로 치부하고 있었습니다", null]], "n": "cheer someone up은 \"~를 기운 나게 하다\"라는 뜻입니다. reason oneself out of ~는 \"이런저런 생각 끝에 ~을 그만두기로 하다\"라는 뜻입니다."},
{"t": "However, in the morning I determined to have a look at it anyhow, so I bought a penny bottle of ink, and with a quill-pen, and seven sheets of foolscap paper, I started off for Pope’s Court.", "sk": "However, in the morning I determined to have a look at it anyhow, so I bought ink, a quill-pen, and foolscap paper, and started off for Pope’s Court.", "skk": "하지만 아침이 되자 어쨌든 가서 확인해보기로 마음먹었고, 그래서 잉크와 깃펜, 대판지를 사서 포프스 코트로 향했습니다.", "ko": "\"하지만 아침이 되자 어쨌든 가서 한번 확인해보기로 마음먹었고, 그래서 1페니짜리 잉크 한 병과 깃펜 하나, 대판지 일곱 장을 사서 포프스 코트로 출발했습니다.\"", "c": [["However, in the morning I determined to have a look at it anyhow", "결심", "하지만 아침이 되자 어쨌든 가서 한번 확인해보기로 마음먹었습니다", null], ["so I bought a penny bottle of ink, and with a quill-pen, and seven sheets of foolscap paper", "행동 ①", "그래서 1페니짜리 잉크 한 병과 깃펜 하나, 대판지 일곱 장을 샀습니다", null], ["I started off for Pope’s Court", "행동 ②", "포프스 코트로 출발했습니다", null]], "n": "determine to ~는 \"~하기로 결심하다\"라는 뜻입니다. quill-pen은 옛날식 \"깃펜\"이고, foolscap(paper)은 옛날 규격의 \"대판 용지\"를 뜻합니다."},
{"t": "Well, to my surprise and delight, everything was as right as possible.", "sk": "To my surprise and delight, everything was as right as possible.", "skk": "놀랍고 기쁘게도, 모든 게 더할 나위 없이 제대로였습니다.", "ko": "\"그런데 놀랍고 기쁘게도, 모든 게 더할 나위 없이 제대로 되어 있었습니다.\"", "c": [["Well, to my surprise and delight", "삽입구", "그런데 놀랍고 기쁘게도", null], ["everything was as right as possible", "주어+동사", "모든 게 더할 나위 없이 제대로 되어 있었습니다", null]], "n": "to one's surprise (and delight)는 \"~가 놀랍게도 (그리고 기쁘게도)\"라는 뜻입니다."},
{"t": "The table was set out ready for me, and Mr. Duncan Ross was there to see that I got fairly to work.", "sk": "The table was set out ready for me, and Mr. Duncan Ross was there to see that I got fairly to work.", "skk": "탁자는 저를 위해 준비되어 있었고, 던컨 로스 씨는 제가 제대로 일을 시작하는지 보러 와 있었습니다.", "ko": "\"탁자는 저를 위해 다 준비되어 있었고, 던컨 로스 씨는 제가 제대로 일을 시작하는지 보려고 그곳에 나와 있었습니다.\"", "c": [["The table was set out ready for me", "주어+동사 ①", "탁자는 저를 위해 다 준비되어 있었습니다", null], ["and Mr. Duncan Ross was there to see that I got fairly to work", "주어+동사 ②", "그리고 던컨 로스 씨는 제가 제대로 일을 시작하는지 보려고 그곳에 나와 있었습니다", null]], "n": "get fairly to work는 \"제대로, 본격적으로 일을 시작하다\"라는 뜻입니다."},
{"t": "He started me off upon the letter A, and then he left me; but he would drop in from time to time to see that all was right with me.", "sk": "He started me off upon the letter A, and then he left me; but he would drop in from time to time to see that all was right with me.", "skk": "그는 저를 A 항목부터 시작하게 했고, 그러고는 저를 두고 갔습니다; 하지만 이따금 들러서 제가 잘하고 있는지 확인하곤 했습니다.", "ko": "\"그는 저를 A 항목부터 시작하게 하고서 저를 두고 떠났습니다, 하지만 이따금씩 들러서 저에게 별일 없는지 확인하곤 했습니다.\"", "c": [["He started me off upon the letter A", "동사 ①", "그는 저를 A 항목부터 시작하게 했습니다", null], ["and then he left me", "동사 ②", "그러고는 저를 두고 떠났습니다", null], ["but he would drop in from time to time to see that all was right with me", "반전 · 반복 행동", "하지만 이따금씩 들러서 제게 별일 없는지 확인하곤 했습니다", null]], "n": "drop in은 \"잠깐 들르다\"라는 뜻입니다. would는 여기서 과거의 반복된 습관을 나타냅니다."},
{"t": "At two o’clock he bade me good-day, complimented me upon the amount that I had written, and locked the door of the office after me.", "sk": "At two o’clock he bade me good-day, complimented me upon the amount that I had written, and locked the door of the office after me.", "skk": "2시가 되면 그는 저에게 인사를 하고, 제가 쓴 분량을 칭찬하고, 제가 나온 뒤 사무실 문을 잠갔습니다.", "ko": "\"두 시가 되면 그는 저에게 인사를 건네고, 제가 써낸 분량을 칭찬해준 뒤, 제가 나오고 나서 사무실 문을 잠갔습니다.\"", "c": [["At two o’clock he bade me good-day", "동사 ①", "두 시가 되면 그는 저에게 인사를 건넸습니다", null], ["complimented me upon the amount that I had written", "동사 ②", "제가 써낸 분량을 칭찬해줬습니다", null], ["and locked the door of the office after me", "동사 ③", "그리고 제가 나오고 나서 사무실 문을 잠갔습니다", null]], "n": "bade는 bid(고하다, 인사하다)의 옛 과거형입니다. compliment A upon B는 \"B에 대해 A를 칭찬하다\"라는 뜻입니다."},
{"t": "This went on day after day, Mr. Holmes, and on Saturday the manager came in and planked down four golden sovereigns for my week’s work.", "sk": "This went on day after day, and on Saturday the manager came in and planked down four golden sovereigns for my week’s work.", "skk": "이런 일이 매일매일 계속됐고, 토요일이 되면 매니저가 와서 제 한 주 일당으로 금화 4소버린을 척 내놨습니다.", "ko": "\"이런 일이 나날이 계속됐습니다, 홈즈 씨, 그리고 토요일이면 매니저가 들어와서 제 일주일 치 일당으로 금화 소버린 넉 닢을 척 내놓았습니다.\"", "c": [["This went on day after day, Mr. Holmes", "주어+동사", "이런 일이 나날이 계속됐습니다, 홈즈 씨", null], ["and on Saturday the manager came in and planked down four golden sovereigns for my week’s work", "결과", "그리고 토요일이면 매니저가 들어와서 제 일주일 치 일당으로 금화 소버린 넉 닢을 척 내놓았습니다", null]], "n": "sovereign은 옛날 영국의 1파운드짜리 금화입니다. plank down은 \"(돈을) 척 내놓다\"라는 뜻입니다."},
{"t": "It was the same next week, and the same the week after.", "sk": "It was the same next week, and the same the week after.", "skk": "다음 주도 마찬가지였고, 그다음 주도 마찬가지였습니다.", "ko": "\"그다음 주도 마찬가지였고, 또 그다음 주도 마찬가지였습니다.\"", "c": [["It was the same next week", "동사 ①", "그다음 주도 마찬가지였습니다", null], ["and the same the week after", "동사 ② · 반복", "그리고 또 그다음 주도 마찬가지였습니다", null]], "n": ""},
{"t": "Every morning I was there at ten, and every afternoon I left at two.", "sk": "Every morning I was there at ten, and every afternoon I left at two.", "skk": "매일 아침 10시에 그곳에 있었고, 매일 오후 2시에 나왔습니다.", "ko": "\"매일 아침 열 시면 그곳에 나와 있었고, 매일 오후 두 시면 자리를 떴습니다.\"", "c": [["Every morning I was there at ten", "주어+동사 ①", "매일 아침 열 시면 그곳에 나와 있었습니다", null], ["and every afternoon I left at two", "주어+동사 ②", "그리고 매일 오후 두 시면 자리를 떴습니다", null]], "n": ""},
{"t": "By degrees Mr. Duncan Ross took to coming in only once of a morning, and then, after a time, he did not come in at all.", "sk": "By degrees Mr. Duncan Ross took to coming in only once of a morning, and then, after a time, he did not come in at all.", "skk": "점차 던컨 로스 씨는 아침에 한 번만 들르게 됐고, 그러다 시간이 지나면서 아예 오지 않게 됐습니다.", "ko": "\"점차 던컨 로스 씨는 아침에 한 번만 들르는 걸로 바뀌더니, 얼마 뒤에는 아예 들르지 않게 됐습니다.\"", "c": [["By degrees Mr. Duncan Ross took to coming in only once of a morning", "동사 ①", "점차 던컨 로스 씨는 아침에 한 번만 들르는 걸로 바뀌었습니다", null], ["and then, after a time, he did not come in at all", "동사 ② · 결과", "그러다 얼마 뒤에는 아예 들르지 않게 됐습니다", null]], "n": "by degrees는 \"점차, 서서히\"라는 뜻입니다. take to ~ing는 \"~하는 습관이 들다, ~하게 되다\"라는 뜻입니다."},
{"t": "Eight weeks passed away like this, and I had written about Abbots and Archery and Armour and Architecture and Attica, and hoped with diligence that I might get on to the B’s before very long.", "sk": "Eight weeks passed away like this, and I had written about Abbots and Archery and Armour and Architecture and Attica, and hoped that I might get on to the B’s before very long.", "skk": "이렇게 8주가 지났고, 저는 Abbots, Archery, Armour, Architecture, Attica 항목을 썼고, 머잖아 B 항목에 이르길 부지런히 바랐습니다.", "ko": "\"이렇게 8주가 지나갔고, 저는 Abbots와 Archery, Armour, Architecture, Attica에 관해 써놓은 상태였는데, 부지런히 하면 머지않아 B 항목에 이를 수 있으리라 바라고 있었습니다.\"", "c": [["Eight weeks passed away like this", "주어+동사", "이렇게 8주가 지나갔습니다", null], ["and I had written about Abbots and Archery and Armour and Architecture and Attica", "행동", "저는 Abbots, Archery, Armour, Architecture, Attica에 관해 써놓은 상태였습니다", null], ["and hoped with diligence that I might get on to the B’s before very long", "바람", "그리고 부지런히 하면 머지않아 B 항목에 이를 수 있으리라 바랐습니다", null]], "n": "diligence는 \"근면, 부지런함\"이라는 뜻의 명사입니다. get on to ~는 \"~에 이르다, 진도가 나가다\"라는 뜻입니다."},
{"t": "It cost me something in foolscap, and I had pretty nearly filled a shelf with my writings.", "sk": "It cost me something in foolscap, and I had pretty nearly filled a shelf with my writings.", "skk": "대판지 값이 좀 들었고, 저는 제가 쓴 것으로 선반 하나를 거의 다 채웠습니다.", "ko": "\"대판지 값이 좀 들었고, 제가 써놓은 것들로 선반 하나를 거의 다 채웠습니다.\"", "c": [["It cost me something in foolscap", "주어+동사", "대판지 값이 좀 들었습니다", null], ["and I had pretty nearly filled a shelf with my writings", "결과", "그리고 제가 써놓은 것들로 선반 하나를 거의 다 채웠습니다", null]], "n": "cost me something in ~은 \"~에 얼마간의 비용이 들다\"라는 뜻입니다. shelf는 \"선반\"이라는 뜻입니다."},
{"t": "And then suddenly the whole business came to an end.", "sk": "And then suddenly the whole business came to an end.", "skk": "그러다 갑자기 그 모든 일이 끝나버렸습니다.", "ko": "\"그러다 갑자기 그 모든 일이 끝나버렸습니다.\"", "c": [["And then suddenly the whole business came to an end.", "주어+동사", "그러다 갑자기 그 모든 일이 끝나버렸습니다.", null]], "n": "come to an end는 \"끝나다\"라는 뜻입니다."},

{"t": "And no later than this morning.", "sk": "And no later than this morning.", "skk": "바로 오늘 아침에요.", "ko": "\"바로 오늘 아침이었습니다.\"", "c": [["And no later than this morning.", "시점 강조", "바로 오늘 아침이었습니다.", null]], "n": "no later than ~은 \"바로 ~에, 늦어도 ~에는\"이라는 뜻으로, 여기서는 \"다름 아닌 오늘 아침\"이라는 뉘앙스를 줍니다."},
{"t": "I went to my work as usual at ten o’clock, but the door was shut and locked, with a little square of cardboard hammered on to the middle of the panel with a tack.", "sk": "I went to my work as usual at ten o’clock, but the door was shut and locked, with a little square of cardboard hammered on to the middle of the panel with a tack.", "skk": "평소처럼 10시에 일하러 갔는데, 문이 닫혀 잠겨 있었고, 작은 마분지 조각이 압정으로 문판 한가운데 박혀 있었습니다.", "ko": "\"평소처럼 열 시에 일을 하러 갔는데, 문이 닫히고 잠겨 있었고, 작은 마분지 조각이 압정으로 문짝 한가운데 박혀 있었습니다.\"", "c": [["I went to my work as usual at ten o’clock", "주어+동사", "평소처럼 열 시에 일을 하러 갔습니다", null], ["but the door was shut and locked", "반전", "그런데 문이 닫히고 잠겨 있었습니다", null], ["with a little square of cardboard hammered on to the middle of the panel with a tack", "부수 상황", "작은 마분지 조각이 압정으로 문짝 한가운데 박혀 있었고요", null]], "n": "cardboard는 \"마분지, 판지\"이고, tack은 \"압정\"입니다. hammered on to는 \"~에 못 박듯 박아 넣다\"라는 뜻입니다."},
{"t": "Here it is, and you can read for yourself.’", "sk": "Here it is, and you can read for yourself.", "skk": "여기 있으니, 직접 읽어보세요.", "ko": "\"'여기 있으니, 직접 한번 읽어보시죠.'\"", "c": [["Here it is", "제시", "'여기 있으니", null], ["and you can read for yourself", "권유", "직접 한번 읽어보시죠", null]], "n": "read for yourself는 \"(남의 말 말고) 직접 읽어보다\"라는 뜻입니다."},
{"t": "He held up a piece of white cardboard about the size of a sheet of note-paper.", "sk": "He held up a piece of white cardboard about the size of a sheet of note-paper.", "skk": "그는 편지지 한 장 크기 정도의 하얀 마분지 조각을 들어 보였습니다.", "ko": "\"그는 편지지 한 장 크기쯤 되는 하얀 마분지 조각을 들어 보였습니다.\"", "c": [["He held up a piece of white cardboard", "주어+동사", "그는 하얀 마분지 조각을 들어 보였습니다", null], ["about the size of a sheet of note-paper", "크기", "편지지 한 장 크기쯤 되는", null]], "n": ""},
{"t": "It read in this fashion:", "sk": "It read in this fashion:", "skk": "거기엔 이렇게 쓰여 있었습니다:", "ko": "\"거기엔 이런 식으로 쓰여 있었습니다.\"", "c": [["It read in this fashion:", "주어+동사", "거기엔 이런 식으로 쓰여 있었습니다.", null]], "n": "여기서 read는 \"(글이) ~라고 쓰여 있다, 읽히다\"라는 뜻의 자동사입니다."},
{"t": "‘THE RED-HEADED LEAGUE IS DISSOLVED. October 9, 1890.’", "sk": "THE RED-HEADED LEAGUE IS DISSOLVED. October 9, 1890.", "skk": "붉은 머리 연맹은 해산되었다. 1890년 10월 9일.", "ko": "\"'붉은 머리 연맹은 해산되었음. 1890년 10월 9일.'\"", "c": [["‘THE RED-HEADED LEAGUE IS DISSOLVED.", "공고문", "'붉은 머리 연맹은 해산되었음.", null], ["October 9, 1890.’", "날짜", "1890년 10월 9일.'", null]], "n": "dissolved는 \"해산된, 없어진\"이라는 뜻입니다. 이 문장은 문 앞에 붙은 공고문의 실제 문구입니다."},
{"t": "Sherlock Holmes and I surveyed this curt announcement and the rueful face behind it, until the comical side of the affair so completely overtopped every other consideration that we both burst out into a roar of laughter.", "sk": "Sherlock Holmes and I surveyed this curt announcement and the rueful face behind it, until the comical side of the affair overtopped every other consideration that we both burst out into a roar of laughter.", "skk": "셜록 홈즈와 저는 이 짤막한 공고문과 그 뒤의 침울한 얼굴을 바라보다가, 결국 그 일의 우스운 면이 다른 모든 생각을 압도해서 둘 다 웃음을 터뜨렸습니다.", "ko": "\"셜록 홈즈와 나는 이 짤막한 공고문과 그 뒤에 있는 침울한 얼굴을 바라보았는데, 결국 그 일의 우스꽝스러운 면이 다른 모든 생각을 완전히 압도해버려서 우리 둘 다 웃음을 터뜨리고 말았습니다.\"", "c": [["Sherlock Holmes and I surveyed this curt announcement and the rueful face behind it", "주어+동사", "셜록 홈즈와 나는 이 짤막한 공고문과 그 뒤에 있는 침울한 얼굴을 바라보았습니다", null], ["until the comical side of the affair so completely overtopped every other consideration", "결과로 이어짐 ①", "결국 그 일의 우스꽝스러운 면이 다른 모든 생각을 완전히 압도해서", null], ["that we both burst out into a roar of laughter", "결과 ②", "우리 둘 다 웃음을 터뜨리고 말았습니다", "so"]], "n": "curt는 \"짤막한, 퉁명스러운\"이라는 뜻이고, rueful은 \"침울한, 후회스러운\"이라는 뜻입니다. so ~ that …은 \"너무 ~해서 …하다\"라는 구문이고, burst out into a roar of laughter는 \"웃음을 터뜨리다\"라는 뜻입니다."},
{"t": "‘I cannot see that there is anything very funny,’ cried our client, flushing up to the roots of his flaming head.", "sk": "I cannot see that there is anything very funny, cried our client, flushing up to the roots of his flaming head.", "skk": "저는 뭐가 그렇게 재밌는지 모르겠군요, 우리 의뢰인이 외쳤다, 불타는 머리 뿌리까지 얼굴을 붉히며.", "ko": "\"'저는 뭐가 그렇게 우스운지 모르겠는데요,' 우리 의뢰인이 외쳤습니다, 그 불타는 듯한 머리 뿌리까지 얼굴이 확 붉어져서.\"", "c": [["‘I cannot see that there is anything very funny,’ cried our client", "주어+동사+화자", "'저는 뭐가 그렇게 우스운지 모르겠는데요,' 우리 의뢰인이 외쳤습니다", null], ["flushing up to the roots of his flaming head", "동시 동작", "그 불타는 듯한 머리 뿌리까지 얼굴이 확 붉어져서", null]], "n": "flush up to ~는 \"~까지 확 붉어지다\"라는 뜻입니다. flaming은 \"불타는 듯한, 새빨간\"이라는 뜻으로 그의 빨간 머리를 가리킵니다."},
{"t": "‘If you can do nothing better than laugh at me, I can go elsewhere.’", "sk": "If you can do nothing better than laugh at me, I can go elsewhere.", "skk": "저를 비웃는 것밖에 못하신다면, 저는 다른 데로 가겠습니다.", "ko": "\"'저를 비웃는 것 말고는 아무것도 못 해주신다면, 저는 다른 데로 가겠습니다.'\"", "c": [["If you can do nothing better than laugh at me", "조건", "저를 비웃는 것 말고는 아무것도 못 해주신다면", null], ["I can go elsewhere", "결과", "저는 다른 데로 가겠습니다", null]], "n": "do nothing better than ~는 \"~하는 것보다 나은 걸 하지 못하다\", 즉 \"고작 ~밖에 못하다\"라는 뜻입니다."},
{"t": "‘No, no,’ cried Holmes, shoving him back into the chair from which he had half risen.", "sk": "No, no, cried Holmes, shoving him back into the chair from which he had half risen.", "skk": "아니, 아니에요, 홈즈가 외치며, 반쯤 일어섰던 의자로 그를 다시 밀어 넣었다.", "ko": "\"'아니, 아니에요,' 홈즈가 외치며, 반쯤 일어섰던 의자로 그를 도로 밀어 넣었습니다.\"", "c": [["‘No, no,’ cried Holmes", "화자", "'아니, 아니에요,' 홈즈가 외쳤습니다", null], ["shoving him back into the chair from which he had half risen", "동시 동작", "반쯤 일어섰던 그 의자로 그를 도로 밀어 넣으며", null]], "n": "shove는 \"밀치다, 떠밀다\"라는 뜻입니다. from which he had half risen은 \"그가 반쯤 일어섰던\"이라며 chair를 꾸밉니다."},
{"t": "‘I really wouldn’t miss your case for the world.", "sk": "I really wouldn’t miss your case for the world.", "skk": "저는 정말이지 당신 사건을 세상 무엇과도 안 바꿀 겁니다.", "ko": "\"'저는 무슨 일이 있어도 당신 사건을 놓치고 싶지 않습니다.'\"", "c": [["I really wouldn’t miss your case for the world.", "주어+동사", "저는 무슨 일이 있어도 당신 사건을 놓치고 싶지 않습니다.", null]], "n": "not ~ for the world는 \"무슨 일이 있어도 ~ 않다\"라는 강조 표현입니다."},

{"t": "‘I started off, Mr. Holmes, but when I got to that address it was a manufactory of artificial knee-caps, and no one in it had ever heard of either Mr. William Morris or Mr. Duncan Ross.’", "sk": "I started off, but when I got to that address it was a manufactory of artificial knee-caps, and no one in it had ever heard of either Mr. William Morris or Mr. Duncan Ross.", "skk": "저는 출발했지만, 그 주소에 가보니 인공 무릎덮개 공장이었고, 거기서는 아무도 윌리엄 모리스 씨나 던컨 로스 씨를 들어본 적이 없었습니다.", "ko": "\"'저는 바로 출발했습니다, 홈즈 씨, 하지만 그 주소에 가보니 인공 무릎덮개를 만드는 공장이었고, 그곳 사람 중 누구도 윌리엄 모리스 씨나 던컨 로스 씨를 들어본 적이 없었습니다.'\"", "c": [["I started off, Mr. Holmes", "주어+동사", "저는 바로 출발했습니다, 홈즈 씨", null], ["but when I got to that address it was a manufactory of artificial knee-caps", "반전", "하지만 그 주소에 가보니 인공 무릎덮개를 만드는 공장이었습니다", null], ["and no one in it had ever heard of either Mr. William Morris or Mr. Duncan Ross", "결과", "그리고 그곳 사람 중 누구도 두 사람 다 들어본 적이 없었습니다", null]], "n": "manufactory는 \"제조 공장\"이라는 뜻입니다. artificial knee-caps는 \"인공 무릎덮개\"를 뜻합니다."},

{"t": "From what you have told me I think that it is possible that graver issues hang from it than might at first sight appear.’", "sk": "From what you have told me I think that it is possible that graver issues hang from it than might at first sight appear.", "skk": "당신이 말해준 것으로 볼 때, 언뜻 보이는 것보다 더 심각한 문제가 걸려 있을 가능성이 있다고 생각합니다.", "ko": "\"'당신이 저에게 말해준 걸로 볼 때, 언뜻 보이는 것보다 더 심각한 문제들이 걸려 있을 가능성이 있다고 생각합니다.'\"", "c": [["From what you have told me I think", "주어+동사", "당신이 저에게 말해준 걸로 볼 때 저는 생각합니다", null], ["that it is possible that graver issues hang from it", "무엇을 생각하는지", "더 심각한 문제들이 걸려 있을 가능성이 있다고", "think"], ["than might at first sight appear", "비교", "언뜻 보이는 것보다", null]], "n": "graver는 grave(심각한)의 비교급입니다. at first sight는 \"언뜻 보기에는\"이라는 뜻입니다."},

{"t": "‘As far as you are personally concerned,’ remarked Holmes, ‘I do not see that you have any grievance against this extraordinary league.", "sk": "As far as you are personally concerned, I do not see that you have any grievance against this extraordinary league.", "skk": "당신 개인적으로만 보면, 이 특이한 리그에 불만을 가질 이유가 없어 보이는데요.", "ko": "\"'당신 개인적으로만 놓고 보면,' 홈즈가 말했습니다, '이 특이한 리그에 대해 불만을 가질 이유는 없어 보입니다.'\"", "c": [["‘As far as you are personally concerned,’ remarked Holmes", "조건+화자", "'당신 개인적으로만 놓고 보면,' 홈즈가 말했습니다", null], ["‘I do not see that you have any grievance against this extraordinary league", "의견", "'이 특이한 리그에 대해 불만을 가질 이유는 없어 보입니다", null]], "n": "as far as ~ be concerned은 \"~에 관한 한\"이라는 뜻입니다. grievance는 \"불만, 불만 사유\"라는 뜻입니다."},
{"t": "On the contrary, you are, as I understand, richer by some £30, to say nothing of the minute knowledge which you have gained on every subject which comes under the letter A.", "sk": "On the contrary, you are richer by some £30, to say nothing of the minute knowledge which you have gained on every subject which comes under the letter A.", "skk": "오히려, 제가 알기로는, 30파운드가량 더 부자가 되셨죠, A로 시작하는 온갖 주제에 대한 세세한 지식을 얻으신 건 말할 것도 없고요.", "ko": "\"오히려, 제가 알기로는, 30파운드가량 더 부자가 되셨습니다, A로 시작하는 온갖 주제에 대해 얻으신 세세한 지식은 말할 것도 없고요.\"", "c": [["On the contrary, you are, as I understand, richer by some £30", "반전+주어동사", "오히려, 제가 알기로는, 30파운드가량 더 부자가 되셨습니다", null], ["to say nothing of the minute knowledge which you have gained on every subject which comes under the letter A", "덧붙임", "A로 시작하는 온갖 주제에 대해 얻으신 세세한 지식은 말할 것도 없고요", null]], "n": "on the contrary는 \"오히려, 그와 반대로\"라는 뜻입니다. to say nothing of ~는 \"~는 말할 것도 없이\"라는 뜻이고, minute는 여기서 \"분\"이 아니라 \"아주 세세한, 미세한\"이라는 형용사입니다."},

{"t": "Holmes sat up in his chair in considerable excitement.", "sk": "Holmes sat up in his chair in considerable excitement.", "skk": "홈즈는 상당한 흥분 속에 의자에서 몸을 일으켰습니다.", "ko": "\"홈즈는 상당히 흥분한 채로 의자에서 몸을 곧추세웠습니다.\"", "c": [["Holmes sat up in his chair in considerable excitement.", "주어+동사", "홈즈는 상당히 흥분한 채로 의자에서 몸을 곧추세웠습니다.", null]], "n": "sit up은 \"(앉은 자세에서) 몸을 곧추세우다\"라는 뜻입니다. considerable은 \"상당한, 꽤 많은\"이라는 뜻입니다."},
{"t": "‘I thought as much,’ said he.", "sk": "I thought as much, said he.", "skk": "그럴 줄 알았어요, 그가 말했다.", "ko": "\"'그럴 줄 알았습니다,' 그가 말했습니다.\"", "c": [["‘I thought as much,’", "반응", "'그럴 줄 알았습니다,'", null], ["said he", "누가 말했는지", "그가 말했습니다", null]], "n": "I thought as much는 \"그럴 줄 알았다\"라는 뜻의 관용 표현입니다."},
{"t": "‘Have you ever observed that his ears are pierced for earrings?’", "sk": "Have you ever observed that his ears are pierced for earrings?", "skk": "그의 귀가 귀걸이를 위해 뚫려 있는 걸 본 적 있나요?", "ko": "\"'그의 귀가 귀걸이를 하려고 뚫려 있는 걸 본 적 있으십니까?'\"", "c": [["‘Have you ever observed", "질문", "'본 적 있으십니까", null], ["that his ears are pierced for earrings?’", "무엇을", "그의 귀가 귀걸이를 하려고 뚫려 있는 걸", "observed"]], "n": "pierced for earrings는 \"귀걸이를 하기 위해 뚫린\"이라는 뜻입니다."},
{"t": "‘Yes, sir. He told me that a gipsy had done it for him when he was a lad.’", "sk": "Yes, sir. He told me that a gipsy had done it for him when he was a lad.", "skk": "네. 그는 소년 시절 집시가 뚫어줬다고 저에게 말했습니다.", "ko": "\"'네, 그렇습니다. 그는 소년 시절에 집시가 뚫어줬다고 저에게 말했습니다.'\"", "c": [["‘Yes, sir. He told me", "확인+주어동사", "'네, 그렇습니다. 그는 저에게 말했습니다", null], ["that a gipsy had done it for him when he was a lad", "무엇을 말했는지", "소년 시절에 집시가 뚫어줬다고", "told"]], "n": "gipsy는 \"집시\"이고, lad는 \"소년, 젊은이\"라는 뜻입니다."},
{"t": "‘Hum!’ said Holmes, sinking back in deep thought.", "sk": "Hum! said Holmes, sinking back in deep thought.", "skk": "흠! 홈즈가 말하며, 깊은 생각에 잠겨 뒤로 기댔다.", "ko": "\"'흠!' 홈즈가 깊은 생각에 잠겨 뒤로 기대며 말했습니다.\"", "c": [["‘Hum!’ said Holmes", "화자", "'흠!' 홈즈가 말했습니다", null], ["sinking back in deep thought", "동시 동작", "깊은 생각에 잠겨 뒤로 기대며", null]], "n": "sink back는 \"뒤로 기대다, 몸을 파묻듯 기대다\"라는 뜻입니다."},
{"t": "‘He is still with you?’", "sk": "He is still with you?", "skk": "아직도 당신과 함께 있나요?", "ko": "\"'그는 아직도 당신 밑에 있습니까?'\"", "c": [["‘He is still with you?’", "질문", "'그는 아직도 당신 밑에 있습니까?'", null]], "n": ""},
{"t": "‘Oh, yes, sir; I have only just left him.’", "sk": "Oh, yes, sir; I have only just left him.", "skk": "네, 방금 막 그를 두고 왔어요.", "ko": "\"'네, 그렇습니다. 방금 막 그를 두고 왔습니다.'\"", "c": [["‘Oh, yes, sir", "확인", "'네, 그렇습니다", null], ["I have only just left him.’", "부연", "방금 막 그를 두고 왔습니다.'", null]], "n": "only just는 \"방금 막, 겨우 지금 막\"이라는 뜻입니다."},
{"t": "‘And has your business been attended to in your absence?’", "sk": "And has your business been attended to in your absence?", "skk": "당신이 없는 동안 사업은 잘 돌아갔나요?", "ko": "\"'그리고 당신이 자리를 비운 동안 사업은 잘 돌아갔습니까?'\"", "c": [["‘And has your business been attended to in your absence?’", "질문", "'그리고 당신이 자리를 비운 동안 사업은 잘 돌아갔습니까?'", null]], "n": "be attended to는 \"처리되다, 돌봐지다\"라는 뜻이고, in your absence는 \"당신이 없는 동안\"이라는 뜻입니다."},
{"t": "‘Nothing to complain of, sir.", "sk": "Nothing to complain of, sir.", "skk": "불평할 게 없어요.", "ko": "\"'딱히 불평할 것은 없습니다.'\"", "c": [["‘Nothing to complain of, sir.", "대답", "'딱히 불평할 것은 없습니다.", null]], "n": "nothing to complain of는 \"불평할 것이 없는, 딱히 문제없는\"이라는 뜻입니다."},
{"t": "There’s never very much to do of a morning.’", "sk": "There’s never very much to do of a morning.", "skk": "아침에는 원래 할 일이 그리 많지 않아요.", "ko": "\"'아침에는 원래 할 일이 그리 많지 않으니까요.'\"", "c": [["There’s never very much to do of a morning.", "주어+동사", "아침에는 원래 할 일이 그리 많지 않습니다.", null]], "n": "of a morning은 \"아침마다, 아침에는\"이라는 옛날식 표현입니다."},
{"t": "‘That will do, Mr. Wilson.", "sk": "That will do, Mr. Wilson.", "skk": "그거면 됐습니다, 윌슨 씨.", "ko": "\"'그 정도면 됐습니다, 윌슨 씨.'\"", "c": [["‘That will do, Mr. Wilson.", "마무리", "'그 정도면 됐습니다, 윌슨 씨.", null]], "n": "That will do는 \"그거면 됐다, 충분하다\"라는 뜻으로 대화를 마무리할 때 씁니다."},
{"t": "I shall be happy to give you an opinion upon the subject in the course of a day or two.", "sk": "I shall be happy to give you an opinion upon the subject in the course of a day or two.", "skk": "하루이틀 안에 기꺼이 이 건에 대한 의견을 드리겠습니다.", "ko": "\"하루이틀 안에 기꺼이 이 건에 대한 제 의견을 드리겠습니다.\"", "c": [["I shall be happy to give you an opinion upon the subject", "주어+동사", "기꺼이 이 건에 대한 제 의견을 드리겠습니다", null], ["in the course of a day or two", "언제", "하루이틀 안에", null]], "n": "in the course of ~는 \"~ 안에, ~하는 동안에\"라는 뜻입니다."},
{"t": "To-day is Saturday, and I hope that by Monday we may come to a conclusion.’", "sk": "To-day is Saturday, and I hope that by Monday we may come to a conclusion.", "skk": "오늘이 토요일이니, 월요일까지는 결론에 이를 수 있기를 바랍니다.", "ko": "\"'오늘이 토요일이니, 월요일쯤에는 결론에 이를 수 있기를 바랍니다.'\"", "c": [["To-day is Saturday", "주어+동사", "오늘이 토요일입니다", null], ["and I hope that by Monday we may come to a conclusion", "바람", "그리고 월요일쯤에는 결론에 이를 수 있기를 바랍니다", null]], "n": "come to a conclusion은 \"결론에 이르다\"라는 뜻입니다."},
{"t": "‘Well, Watson,’ said Holmes when our visitor had left us, ‘what do you make of it all?’", "sk": "Well, Watson, said Holmes when our visitor had left us, what do you make of it all?", "skk": "자, 왓슨, 손님이 떠난 뒤 홈즈가 말했다, 이걸 어떻게 생각해요?", "ko": "\"'자, 왓슨,' 손님이 떠나고 나서 홈즈가 말했습니다, '이걸 다 어떻게 보십니까?'\"", "c": [["‘Well, Watson,’ said Holmes when our visitor had left us", "화자+시점", "'자, 왓슨,' 손님이 떠나고 나서 홈즈가 말했습니다", null], ["‘what do you make of it all?’", "질문", "'이걸 다 어떻게 보십니까?'", null]], "n": "What do you make of ~?는 \"~을 어떻게 생각하나요?\"라는 뜻입니다."},
{"t": "‘I make nothing of it,’ I answered frankly.", "sk": "I make nothing of it, I answered frankly.", "skk": "저는 전혀 모르겠어요, 저는 솔직하게 대답했다.", "ko": "\"'저는 도무지 모르겠습니다,' 저는 솔직하게 대답했습니다.\"", "c": [["‘I make nothing of it,’", "대답", "'저는 도무지 모르겠습니다,'", null], ["I answered frankly", "누가 어떻게 대답했는지", "저는 솔직하게 대답했습니다", null]], "n": "make nothing of ~는 \"~을 전혀 이해하지 못하다\"라는 뜻입니다. frankly는 \"솔직하게\"라는 뜻입니다."},
{"t": "‘It is a most mysterious business.’", "sk": "It is a most mysterious business.", "skk": "정말 알 수 없는 사건이에요.", "ko": "\"'정말이지 알 수 없는 사건입니다.'\"", "c": [["‘It is a most mysterious business.’", "주어+동사", "'정말이지 알 수 없는 사건입니다.'", null]], "n": "mysterious는 \"불가사의한, 알 수 없는\"이라는 뜻입니다."},
{"t": "‘As a rule,’ said Holmes, ‘the more bizarre a thing is the less mysterious it proves to be.", "sk": "As a rule, the more bizarre a thing is the less mysterious it proves to be.", "skk": "대체로, 어떤 일이 기이할수록 그것은 덜 알 수 없는 것으로 밝혀지죠.", "ko": "\"'대체로,' 홈즈가 말했습니다, '어떤 일이 기이할수록 오히려 덜 알 수 없는 것으로 밝혀지는 법입니다.'\"", "c": [["‘As a rule,’ said Holmes", "화자", "'대체로,' 홈즈가 말했습니다", null], ["‘the more bizarre a thing is the less mysterious it proves to be", "의견", "'어떤 일이 기이할수록 오히려 덜 알 수 없는 것으로 밝혀지는 법입니다", null]], "n": "as a rule은 \"대체로, 일반적으로\"라는 뜻입니다. the more ~ the less …는 \"~할수록 더 …하다\"라는 비례 구문입니다."},
{"t": "It is your commonplace, featureless crimes which are really puzzling, just as a commonplace face is the most difficult to identify.", "sk": "It is your commonplace, featureless crimes which are really puzzling, just as a commonplace face is the most difficult to identify.", "skk": "정말로 알쏭달쏭한 건 평범하고 특징 없는 범죄죠, 평범한 얼굴을 알아보기 가장 어려운 것처럼요.", "ko": "\"정말로 알쏭달쏭한 것은 평범하고 특징 없는 범죄입니다, 평범한 얼굴을 가장 알아보기 어려운 것과 마찬가지죠.\"", "c": [["It is your commonplace, featureless crimes which are really puzzling", "강조 구문", "정말로 알쏭달쏭한 것은 평범하고 특징 없는 범죄입니다", null], ["just as a commonplace face is the most difficult to identify", "비교", "평범한 얼굴을 가장 알아보기 어려운 것과 마찬가지죠", null]], "n": "It is A which is B는 \"B한 것은 바로 A다\"라는 강조 구문입니다. featureless는 \"특징 없는\"이고 puzzling은 \"알쏭달쏭하게 하는\"이라는 뜻입니다."},
{"t": "But I must be prompt over this matter.’", "sk": "But I must be prompt over this matter.", "skk": "하지만 이 건에 대해서는 신속해야 해요.", "ko": "\"'하지만 이 건에 대해서는 신속하게 움직여야 합니다.'\"", "c": [["But I must be prompt over this matter.", "주어+동사", "하지만 이 건에 대해서는 신속하게 움직여야 합니다.", null]], "n": "prompt는 \"신속한, 지체 없는\"이라는 뜻의 형용사입니다."},
{"t": "‘What are you going to do, then?’ I asked.", "sk": "What are you going to do, then? I asked.", "skk": "그럼 뭘 하실 건가요? 제가 물었다.", "ko": "\"'그럼 뭘 하실 겁니까?' 제가 물었습니다.\"", "c": [["‘What are you going to do, then?’", "질문", "'그럼 뭘 하실 겁니까?'", null], ["I asked", "누가 물었는지", "제가 물었습니다", null]], "n": ""},
{"t": "‘To smoke,’ he answered.", "sk": "To smoke, he answered.", "skk": "담배 피우는 거요, 그가 대답했다.", "ko": "\"'담배를 피울 겁니다,' 그가 대답했습니다.\"", "c": [["‘To smoke,’", "대답", "'담배를 피울 겁니다,'", null], ["he answered", "누가 대답했는지", "그가 대답했습니다", null]], "n": ""},
{"t": "‘It is quite a three pipe problem, and I beg that you won’t speak to me for fifty minutes.’", "sk": "It is quite a three pipe problem, and I beg that you won’t speak to me for fifty minutes.", "skk": "이건 파이프 세 대짜리 문제예요, 그러니 50분 동안 저에게 말 걸지 말아주세요.", "ko": "\"'이건 완전히 파이프 세 대짜리 문제입니다, 그러니 50분 동안은 저에게 말을 걸지 말아주시길 부탁드립니다.'\"", "c": [["‘It is quite a three pipe problem", "평가", "'이건 완전히 파이프 세 대짜리 문제입니다", null], ["and I beg that you won’t speak to me for fifty minutes", "부탁", "그러니 50분 동안은 저에게 말을 걸지 말아주시길 부탁드립니다", null]], "n": "a three pipe problem은 홈즈가 만든 표현으로, \"파이프 담배 세 대를 피울 만큼 골똘히 생각해야 할 문제\"를 뜻합니다."},
{"t": "He curled himself up in his chair, with his thin knees drawn up to his hawk-like nose, and there he sat with his eyes closed and his black clay pipe thrusting out like the bill of some strange bird.", "sk": "He curled himself up in his chair, with his thin knees drawn up to his hawk-like nose, and there he sat with his eyes closed and his black clay pipe thrusting out like the bill of some strange bird.", "skk": "그는 의자에서 몸을 웅크렸다, 마른 무릎을 매부리코까지 끌어당긴 채, 그리고 눈을 감고 앉아 검은 점토 파이프를 이상한 새의 부리처럼 내밀고 있었다.", "ko": "\"그는 의자에서 몸을 웅크리고 앉아, 마른 무릎을 매부리코까지 끌어당긴 채, 눈을 감고 앉아 검은 점토 파이프를 이상한 새의 부리처럼 쭉 내밀고 있었습니다.\"", "c": [["He curled himself up in his chair", "주어+동사", "그는 의자에서 몸을 웅크리고 앉았습니다", null], ["with his thin knees drawn up to his hawk-like nose", "부수 상황 ①", "마른 무릎을 매부리코까지 끌어당긴 채", null], ["and there he sat with his eyes closed and his black clay pipe thrusting out like the bill of some strange bird", "부수 상황 ②", "눈을 감고 앉아 검은 점토 파이프를 이상한 새의 부리처럼 쭉 내밀고 있었습니다", null]], "n": "curl up은 \"몸을 웅크리다\"라는 뜻입니다. hawk-like nose는 \"매부리코\"를, bill은 여기서 새의 \"부리\"를 뜻합니다."},
{"t": "I had come to the conclusion that he had dropped asleep, and indeed was nodding myself, when he suddenly sprang out of his chair with the gesture of a man who has made up his mind and put his pipe down upon the mantelpiece.", "sk": "I had come to the conclusion that he had dropped asleep, and indeed was nodding myself, when he suddenly sprang out of his chair and put his pipe down upon the mantelpiece.", "skk": "저는 그가 잠들었다고 결론짓고, 실은 저도 졸고 있었는데, 그때 그가 갑자기 의자에서 벌떡 일어나 파이프를 벽난로 선반에 내려놨습니다.", "ko": "\"저는 그가 잠들었다고 결론지었고, 사실 저도 졸고 있었는데, 그때 그가 갑자기 마음을 정한 사람의 몸짓으로 의자에서 벌떡 일어나 파이프를 벽난로 선반 위에 내려놓았습니다.\"", "c": [["I had come to the conclusion that he had dropped asleep, and indeed was nodding myself", "주어+동사", "저는 그가 잠들었다고 결론지었고, 사실 저도 졸고 있었습니다", null], ["when he suddenly sprang out of his chair with the gesture of a man who has made up his mind", "시점", "그때 그가 갑자기 마음을 정한 사람의 몸짓으로 의자에서 벌떡 일어났습니다", null], ["and put his pipe down upon the mantelpiece", "동사", "그리고 파이프를 벽난로 선반 위에 내려놓았습니다", null]], "n": "drop asleep은 \"잠들다\"라는 뜻입니다. make up one's mind는 \"결심하다, 마음을 정하다\"라는 뜻입니다."},
{"t": "‘Sarasate plays at the St. James’s Hall this afternoon,’ he remarked.", "sk": "Sarasate plays at the St. James’s Hall this afternoon, he remarked.", "skk": "사라사테가 오늘 오후 세인트 제임스 홀에서 연주해요, 그가 말했다.", "ko": "\"'사라사테가 오늘 오후 세인트 제임스 홀에서 연주합니다,' 그가 말했습니다.\"", "c": [["‘Sarasate plays at the St. James’s Hall this afternoon,’", "소식", "'사라사테가 오늘 오후 세인트 제임스 홀에서 연주합니다,'", null], ["he remarked", "누가 말했는지", "그가 말했습니다", null]], "n": "사라사테(Sarasate)는 실존했던 스페인 바이올린 연주자입니다."},
{"t": "‘What do you think, Watson?", "sk": "What do you think, Watson?", "skk": "어떻게 생각해요, 왓슨?", "ko": "\"'어떻게 생각하십니까, 왓슨?'\"", "c": [["‘What do you think, Watson?", "질문", "'어떻게 생각하십니까, 왓슨?", null]], "n": ""},
{"t": "Could your patients spare you for a few hours?’", "sk": "Could your patients spare you for a few hours?", "skk": "환자분들이 몇 시간 정도 당신을 놔줄 수 있을까요?", "ko": "\"'환자분들이 몇 시간 정도는 당신을 봐드릴 수 있을까요?'\"", "c": [["Could your patients spare you for a few hours?", "질문", "환자분들이 몇 시간 정도는 당신을 봐드릴 수 있을까요?", null]], "n": "spare someone은 \"~를 (다른 일을 위해) 내어주다, 놓아주다\"라는 뜻입니다."},
{"t": "‘I have nothing to do to-day.", "sk": "I have nothing to do to-day.", "skk": "오늘은 할 일이 없어요.", "ko": "\"'오늘은 딱히 할 일이 없습니다.'\"", "c": [["‘I have nothing to do to-day.", "대답", "'오늘은 딱히 할 일이 없습니다.", null]], "n": ""},
{"t": "My practice is never very absorbing.’", "sk": "My practice is never very absorbing.", "skk": "제 진료가 늘 그리 바쁜 편은 아니에요.", "ko": "\"'제 진료는 원래 그렇게 정신없이 바쁜 편이 아니거든요.'\"", "c": [["My practice is never very absorbing.", "주어+동사", "제 진료는 원래 그렇게 정신없이 바쁜 편이 아닙니다.", null]], "n": "absorbing은 원래 \"몰입시키는\"이라는 뜻인데, 여기서는 진료가 사람을 꽉 붙잡을 만큼 바쁘지 않다는 뜻입니다."},
{"t": "‘Then put on your hat and come.", "sk": "Then put on your hat and come.", "skk": "그럼 모자 쓰고 와요.", "ko": "\"'그럼 모자를 쓰고 따라오세요.'\"", "c": [["‘Then put on your hat and come.", "제안", "'그럼 모자를 쓰고 따라오세요.", null]], "n": ""},
{"t": "I am going through the City first, and we can have some lunch on the way.", "sk": "I am going through the City first, and we can have some lunch on the way.", "skk": "저는 먼저 시티를 거쳐 가는데, 가는 길에 점심을 먹을 수 있어요.", "ko": "\"저는 먼저 시티를 거쳐 갈 건데, 가는 길에 점심을 좀 먹을 수 있겠네요.\"", "c": [["I am going through the City first", "주어+동사", "저는 먼저 시티를 거쳐 갈 겁니다", null], ["and we can have some lunch on the way", "제안", "그리고 가는 길에 점심을 좀 먹을 수 있겠네요", null]], "n": "the City는 런던 금융가(런던 시티)를 가리키는 고유명사입니다."},
{"t": "I observe that there is a good deal of German music on the programme, which is rather more to my taste than Italian or French.", "sk": "I observe that there is a good deal of German music on the programme, which is rather more to my taste than Italian or French.", "skk": "프로그램에 독일 음악이 꽤 많더군요, 그게 이탈리아나 프랑스 음악보다 제 취향에 더 맞아요.", "ko": "\"보아하니 프로그램에 독일 음악이 꽤 많던데, 그게 이탈리아나 프랑스 음악보다 제 취향에 더 맞습니다.\"", "c": [["I observe that there is a good deal of German music on the programme", "주어+동사", "보아하니 프로그램에 독일 음악이 꽤 많더군요", null], ["which is rather more to my taste than Italian or French", "부연", "그게 이탈리아나 프랑스 음악보다 제 취향에 더 맞습니다", "music"]], "n": "a good deal of ~는 \"꽤 많은 ~\"라는 뜻입니다. more to one's taste는 \"~의 취향에 더 맞는\"이라는 뜻입니다."},
{"t": "It is introspective, and I want to introspect.", "sk": "It is introspective, and I want to introspect.", "skk": "그건 성찰적이라서, 저도 성찰하고 싶거든요.", "ko": "\"성찰적인 음악이라서, 저도 좀 성찰을 하고 싶습니다.\"", "c": [["It is introspective", "주어+동사", "성찰적인 음악입니다", null], ["and I want to introspect", "이유+바람", "그래서 저도 좀 성찰을 하고 싶습니다", null]], "n": "introspective는 \"자기 성찰적인\"이고, introspect는 \"성찰하다, 내면을 들여다보다\"라는 동사입니다."},
{"t": "Come along!’", "sk": "Come along!", "skk": "같이 가요!", "ko": "\"'자, 같이 갑시다!'\"", "c": [["Come along!", "권유", "'자, 같이 갑시다!'", null]], "n": "come along은 \"따라오다, 같이 가다\"라는 뜻입니다."},
{"t": "We travelled by the Underground as far as Aldersgate; and a short walk took us to Saxe-Coburg Square, the scene of the singular story which we had listened to in the morning.", "sk": "We travelled by the Underground as far as Aldersgate; and a short walk took us to Saxe-Coburg Square, the scene of the singular story which we had listened to in the morning.", "skk": "우리는 지하철을 타고 알더스게이트까지 갔고, 짧게 걸어서 색스코버그 스퀘어에 도착했습니다, 아침에 들었던 그 기이한 이야기의 무대인.", "ko": "\"우리는 지하철을 타고 알더스게이트까지 갔고, 거기서 조금 걸어 색스코버그 스퀘어에 이르렀습니다, 아침에 우리가 들었던 그 기이한 이야기의 무대인 그곳 말입니다.\"", "c": [["We travelled by the Underground as far as Aldersgate", "동사 ①", "우리는 지하철을 타고 알더스게이트까지 갔습니다", null], ["and a short walk took us to Saxe-Coburg Square", "동사 ②", "그리고 짧게 걸어서 색스코버그 스퀘어에 이르렀습니다", null], ["the scene of the singular story which we had listened to in the morning", "앞 명사(Square)를 꾸밈", "아침에 우리가 들었던 그 기이한 이야기의 무대인", "Square"]], "n": "the Underground는 런던의 지하철을 가리키고, singular는 여기서 \"단수\"가 아니라 \"기이한, 특이한\"이라는 뜻입니다."},
{"t": "It was a poky, little, shabby-genteel place, where four lines of dingy two-storied brick houses looked out into a small railed-in enclosure, where a lawn of weedy grass and a few clumps of faded laurel bushes made a hard fight against a smoke-laden and uncongenial atmosphere.", "sk": "It was a poky, shabby-genteel place, where dingy brick houses looked out into a small enclosure, where weedy grass and faded laurel bushes made a hard fight against an uncongenial atmosphere.", "skk": "그곳은 좁고 초라하면서도 격식 차린 듯한 곳이었습니다, 지저분한 벽돌집들이 작은 울타리 친 공터를 내다보고 있었고, 잡초 무성한 잔디와 시든 월계수 덤불이 답답한 공기와 힘겹게 싸우는 곳이었습니다.", "ko": "\"그곳은 비좁고 초라하지만 나름 격식을 차린 듯한 곳이었습니다, 지저분한 2층짜리 벽돌집 네 줄이 작은 울타리 친 공터를 내다보고 있었고, 그 안에는 잡초 무성한 잔디와 시든 월계수 덤불 몇 그루가 매캐하고 답답한 공기에 맞서 힘겹게 버티고 있었습니다.\"", "c": [["It was a poky, little, shabby-genteel place", "주어+동사", "그곳은 비좁고 초라하지만 나름 격식을 차린 듯한 곳이었습니다", null], ["where four lines of dingy two-storied brick houses looked out into a small railed-in enclosure", "부연 ①", "지저분한 2층짜리 벽돌집 네 줄이 작은 울타리 친 공터를 내다보고 있었습니다", null], ["where a lawn of weedy grass and a few clumps of faded laurel bushes made a hard fight against a smoke-laden and uncongenial atmosphere", "부연 ②", "그 안에는 잡초 무성한 잔디와 시든 월계수 덤불 몇 그루가 매캐하고 답답한 공기에 맞서 힘겹게 버티고 있었습니다", null]], "n": "poky는 \"비좁은\", shabby-genteel은 \"초라하지만 격식은 차린\"이라는 뜻입니다. uncongenial은 \"쾌적하지 않은, 마음에 안 드는\"이라는 뜻입니다."},
{"t": "Three gilt balls and a brown board with ‘JABEZ WILSON’ in white letters, upon a corner house, announced the place where our red-headed client carried on his business.", "sk": "Three gilt balls and a brown board with JABEZ WILSON in white letters announced the place where our red-headed client carried on his business.", "skk": "금박 공 세 개와 흰 글씨로 '제이비즈 윌슨'이라 적힌 갈색 간판이 우리 빨간 머리 의뢰인이 사업을 하는 곳을 알려줬습니다.", "ko": "\"금박을 입힌 공 세 개와, 흰 글씨로 '제이비즈 윌슨'이라 적힌 갈색 간판이 모퉁이 집에 걸려 있어, 우리 빨간 머리 의뢰인이 사업을 하는 곳임을 알려주고 있었습니다.\"", "c": [["Three gilt balls and a brown board with ‘JABEZ WILSON’ in white letters, upon a corner house", "주어", "금박을 입힌 공 세 개와, 흰 글씨로 '제이비즈 윌슨'이라 적힌 갈색 간판이 모퉁이 집에 걸려", null], ["announced the place where our red-headed client carried on his business", "동사", "우리 빨간 머리 의뢰인이 사업을 하는 곳임을 알려주고 있었습니다", null]], "n": "금박 공 세 개(three gilt balls)는 전당포를 나타내는 전통적인 표지입니다. gilt는 \"금박을 입힌\"이라는 뜻입니다."},
{"t": "Sherlock Holmes stopped in front of it with his head on one side and looked it all over, with his eyes shining brightly between puckered lids.", "sk": "Sherlock Holmes stopped in front of it with his head on one side and looked it all over, with his eyes shining brightly between puckered lids.", "skk": "셜록 홈즈는 고개를 한쪽으로 기울인 채 그 앞에 멈춰 서서 전체를 훑어봤습니다, 찌푸린 눈꺼풀 사이로 눈이 밝게 빛나며.", "ko": "\"셜록 홈즈는 고개를 한쪽으로 기울인 채 그 앞에 멈춰 서서 건물 전체를 훑어봤습니다, 찌푸린 눈꺼풀 사이로 눈이 밝게 빛나는 채로요.\"", "c": [["Sherlock Holmes stopped in front of it with his head on one side", "주어+동사", "셜록 홈즈는 고개를 한쪽으로 기울인 채 그 앞에 멈춰 섰습니다", null], ["and looked it all over", "동사 ②", "그리고 건물 전체를 훑어봤습니다", null], ["with his eyes shining brightly between puckered lids", "부수 상황", "찌푸린 눈꺼풀 사이로 눈이 밝게 빛나는 채로요", null]], "n": "puckered lids는 \"찌푸려 주름진 눈꺼풀\"이라는 뜻입니다."},
{"t": "Then he walked slowly up the street, and then down again to the corner, still looking keenly at the houses.", "sk": "Then he walked slowly up the street, and then down again to the corner, still looking keenly at the houses.", "skk": "그러고는 천천히 거리를 걸어 올라갔다가, 다시 모퉁이까지 내려왔습니다, 여전히 집들을 예리하게 살피며.", "ko": "\"그러고는 천천히 거리를 걸어 올라갔다가, 다시 모퉁이까지 걸어 내려왔습니다, 여전히 집들을 예리하게 살피면서요.\"", "c": [["Then he walked slowly up the street", "동사 ①", "그러고는 천천히 거리를 걸어 올라갔습니다", null], ["and then down again to the corner", "동사 ②", "다시 모퉁이까지 걸어 내려왔습니다", null], ["still looking keenly at the houses", "동시 동작", "여전히 집들을 예리하게 살피면서요", null]], "n": "keenly는 \"예리하게, 날카롭게\"라는 뜻입니다."},
{"t": "Finally he returned to the pawnbroker’s, and, having thumped vigorously upon the pavement with his stick two or three times, he went up to the door and knocked.", "sk": "Finally he returned to the pawnbroker’s, and, having thumped vigorously upon the pavement with his stick two or three times, he went up to the door and knocked.", "skk": "마침내 그는 전당포로 돌아왔고, 지팡이로 인도를 두세 번 세게 두드린 뒤, 문으로 가서 노크했습니다.", "ko": "\"마침내 그는 전당포로 돌아왔고, 지팡이로 보도를 두세 번 세게 쿵쿵 두드린 다음, 문 앞으로 가서 노크를 했습니다.\"", "c": [["Finally he returned to the pawnbroker’s", "동사 ①", "마침내 그는 전당포로 돌아왔습니다", null], ["and, having thumped vigorously upon the pavement with his stick two or three times", "동시 상황", "지팡이로 보도를 두세 번 세게 쿵쿵 두드린 다음", null], ["he went up to the door and knocked", "동사 ②", "문 앞으로 가서 노크를 했습니다", null]], "n": "thump는 \"쿵쿵 치다, 두드리다\"라는 뜻이고, vigorously는 \"힘차게, 세차게\"라는 뜻입니다. pavement는 영국식으로 \"보도, 인도\"를 뜻합니다."},
{"t": "It was instantly opened by a bright-looking, clean-shaven young fellow, who asked him to step in.", "sk": "It was instantly opened by a bright-looking, clean-shaven young fellow, who asked him to step in.", "skk": "문은 곧바로 총명해 보이는 말끔히 면도한 젊은이가 열어줬고, 그는 들어오라고 청했습니다.", "ko": "\"문은 곧바로 총명해 보이는, 말끔히 면도한 젊은이가 열어줬고, 그는 홈즈에게 들어오라고 청했습니다.\"", "c": [["It was instantly opened by a bright-looking, clean-shaven young fellow", "주어+동사", "문은 곧바로 총명해 보이는, 말끔히 면도한 젊은이가 열어줬습니다", null], ["who asked him to step in", "부연", "그리고 그는 홈즈에게 들어오라고 청했습니다", "fellow"]], "n": "clean-shaven은 \"말끔히 면도한\"이라는 뜻입니다. step in은 \"들어오다\"라는 뜻입니다."},
{"t": "‘Thank you,’ said Holmes, ‘I only wished to ask you how you would go from here to the Strand.’", "sk": "Thank you, said Holmes, I only wished to ask you how you would go from here to the Strand.", "skk": "고마워요, 홈즈가 말했다, 여기서 스트랜드로 어떻게 가는지 물어보고 싶었을 뿐이에요.", "ko": "\"'고맙습니다,' 홈즈가 말했습니다, '여기서 스트랜드까지 어떻게 가는지 여쭤보고 싶었을 뿐입니다.'\"", "c": [["‘Thank you,’ said Holmes", "화자", "'고맙습니다,' 홈즈가 말했습니다", null], ["‘I only wished to ask you how you would go from here to the Strand.’", "용건", "'여기서 스트랜드까지 어떻게 가는지 여쭤보고 싶었을 뿐입니다.'", null]], "n": ""},
{"t": "‘Third right, fourth left,’ answered the assistant promptly, closing the door.", "sk": "Third right, fourth left, answered the assistant promptly, closing the door.", "skk": "세 번째에서 우회전, 네 번째에서 좌회전이요, 조수가 재빨리 대답하며 문을 닫았습니다.", "ko": "\"'세 번째 길에서 우회전, 네 번째 길에서 좌회전입니다,' 조수가 지체 없이 대답하며 문을 닫았습니다.\"", "c": [["‘Third right, fourth left,’", "대답", "'세 번째 길에서 우회전, 네 번째 길에서 좌회전입니다,'", null], ["answered the assistant promptly, closing the door", "동시 동작", "조수가 지체 없이 대답하며 문을 닫았습니다", null]], "n": "promptly는 \"지체 없이, 즉시\"라는 뜻입니다."},
{"t": "‘Smart fellow, that,’ observed Holmes as we walked away.", "sk": "Smart fellow, that, observed Holmes as we walked away.", "skk": "똑똑한 친구네요, 저 사람, 우리가 걸어가면서 홈즈가 말했다.", "ko": "\"'똑똑한 친구로군요, 저 사람은,' 우리가 자리를 뜨며 홈즈가 말했습니다.\"", "c": [["‘Smart fellow, that,’", "평가", "'똑똑한 친구로군요, 저 사람은,'", null], ["observed Holmes as we walked away", "누가 언제 말했는지", "우리가 자리를 뜨며 홈즈가 말했습니다", null]], "n": "Smart fellow, that는 That is a smart fellow의 도치된 감탄 표현입니다."},
{"t": "‘He is, in my judgment, the fourth smartest man in London, and for daring I am not sure that he has not a claim to be third.", "sk": "He is the fourth smartest man in London, and for daring I am not sure that he has not a claim to be third.", "skk": "제 판단으론 그는 런던에서 네 번째로 똑똑한 사람이고, 대담함으로는 세 번째가 될 자격이 있을지도 몰라요.", "ko": "\"'제 판단으로는 그가 런던에서 네 번째로 똑똑한 사람이고, 대담함으로 치면 세 번째 자리를 노릴 자격이 없지 않을 겁니다.'\"", "c": [["‘He is, in my judgment, the fourth smartest man in London", "평가 ①", "'제 판단으로는 그가 런던에서 네 번째로 똑똑한 사람입니다", null], ["and for daring I am not sure that he has not a claim to be third", "평가 ②", "그리고 대담함으로 치면 세 번째 자리를 노릴 자격이 없지 않을 겁니다", null]], "n": "in my judgment는 \"내 판단으로는\"이라는 뜻입니다. have a claim to ~는 \"~할 자격/권리가 있다\"라는 뜻입니다."},
{"t": "I have known something of him before.’", "sk": "I have known something of him before.", "skk": "전에 그에 대해 좀 알고 있었어요.", "ko": "\"'전에 그에 대해 좀 알고 있었거든요.'\"", "c": [["I have known something of him before.", "주어+동사", "전에 그에 대해 좀 알고 있었거든요.", null]], "n": ""},
{"t": "‘Evidently,’ said I, ‘Mr. Wilson’s assistant counts for a good deal in this mystery of the Red-headed League.", "sk": "Evidently, said I, Mr. Wilson’s assistant counts for a good deal in this mystery of the Red-headed League.", "skk": "분명히, 제가 말했다, 윌슨의 조수가 이 붉은 머리 연맹 사건에서 큰 비중을 차지하네요.", "ko": "\"'분명히,' 제가 말했습니다, '윌슨 씨의 조수가 이 붉은 머리 연맹 사건에서 상당한 비중을 차지하는군요.'\"", "c": [["‘Evidently,’ said I", "화자", "'분명히,' 제가 말했습니다", null], ["‘Mr. Wilson’s assistant counts for a good deal in this mystery of the Red-headed League", "의견", "'윌슨 씨의 조수가 이 붉은 머리 연맹 사건에서 상당한 비중을 차지하는군요", null]], "n": "count for a good deal는 \"상당한 비중을 차지하다, 중요하다\"라는 뜻입니다."},

{"t": "The road in which we found ourselves as we turned round the corner from the retired Saxe-Coburg Square presented as great a contrast to it as the front of a picture does to the back.", "sk": "The road presented as great a contrast to it as the front of a picture does to the back.", "skk": "모퉁이를 돌자 나온 그 길은 그림의 앞면이 뒷면과 다르듯 그곳과 극명한 대조를 이루었습니다.", "ko": "\"한적한 색스코버그 스퀘어의 모퉁이를 돌아서자 나타난 그 길은, 마치 그림의 앞면이 뒷면과 다르듯 그곳과 극명한 대조를 이루었습니다.\"", "c": [["The road in which we found ourselves as we turned round the corner from the retired Saxe-Coburg Square", "주어", "한적한 색스코버그 스퀘어의 모퉁이를 돌아서자 나타난 그 길은", null], ["presented as great a contrast to it as the front of a picture does to the back.", "동사", "마치 그림의 앞면이 뒷면과 다르듯 그곳과 극명한 대조를 이루었습니다.", null]], "n": "as great a ~ as …는 \"…만큼이나 큰 ~\"라는 동등 비교 구문입니다. retired는 여기서 \"한적한, 외진\"이라는 뜻입니다."},
{"t": "It was one of the main arteries which conveyed the traffic of the City to the north and west.", "sk": "It was one of the main arteries which conveyed the traffic of the City to the north and west.", "skk": "그곳은 시티의 교통을 북쪽과 서쪽으로 실어 나르는 주요 간선도로 중 하나였습니다.", "ko": "\"그곳은 런던 시티의 교통을 북쪽과 서쪽으로 실어 나르는 주요 간선도로 가운데 하나였습니다.\"", "c": [["It was one of the main arteries", "주어+동사", "그곳은 주요 간선도로 가운데 하나였습니다", null], ["which conveyed the traffic of the City to the north and west.", "부연", "런던 시티의 교통을 북쪽과 서쪽으로 실어 나르는", null]], "n": "artery는 원래 \"동맥\"인데 여기서는 비유적으로 \"간선도로\"를 뜻합니다. convey는 \"실어 나르다, 운반하다\"라는 뜻입니다."},
{"t": "The roadway was blocked with the immense stream of commerce flowing in a double tide inward and outward, while the footpaths were black with the hurrying swarm of pedestrians.", "sk": "The roadway was blocked with the immense stream of commerce, while the footpaths were black with the hurrying swarm of pedestrians.", "skk": "차도는 안팎으로 이중 물결처럼 흐르는 어마어마한 상업 행렬로 막혀 있었고, 보도는 서두르는 보행자 무리로 새까맸습니다.", "ko": "\"차도는 안팎으로 이중 물결처럼 흘러가는 어마어마한 상업의 흐름으로 꽉 막혀 있었고, 보도는 서둘러 걷는 보행자 무리로 새까맣게 뒤덮여 있었습니다.\"", "c": [["The roadway was blocked with the immense stream of commerce flowing in a double tide inward and outward", "주어+동사 ①", "차도는 안팎으로 이중 물결처럼 흘러가는 어마어마한 상업의 흐름으로 꽉 막혀 있었고", null], ["while the footpaths were black with the hurrying swarm of pedestrians.", "주어+동사 ②", "보도는 서둘러 걷는 보행자 무리로 새까맣게 뒤덮여 있었습니다.", null]], "n": "commerce는 \"상업\", tide는 \"물결, 조류\"라는 뜻입니다. footpath는 \"보도\", swarm은 \"무리, 떼\", pedestrian은 \"보행자\"라는 뜻입니다."},
{"t": "It was difficult to realise as we looked at the line of fine shops and stately business premises that they really abutted on the other side upon the faded and stagnant square which we had just quitted.", "sk": "It was difficult to realise that they really abutted upon the faded and stagnant square which we had just quitted.", "skk": "멋진 가게들과 위풍당당한 상점 건물들을 보면서, 그것들이 방금 떠나온 빛바래고 정체된 광장과 실제로 맞닿아 있다는 걸 실감하기 어려웠습니다.", "ko": "\"멋들어진 가게들과 위풍당당한 상점 건물들이 늘어선 것을 보고 있으면, 그것들이 뒤편으로는 방금 떠나온 빛바래고 정체된 그 광장과 실제로 맞닿아 있다는 사실을 실감하기 어려웠습니다.\"", "c": [["It was difficult to realise", "주어+동사", "실감하기 어려웠습니다", null], ["as we looked at the line of fine shops and stately business premises", "부수 상황", "멋들어진 가게들과 위풍당당한 상점 건물들이 늘어선 것을 보고 있으면", null], ["that they really abutted on the other side upon the faded and stagnant square which we had just quitted", "무엇을 실감하기 어려운지", "그것들이 뒤편으로는 방금 떠나온 빛바래고 정체된 그 광장과 실제로 맞닿아 있다는 사실을", "realise"]], "n": "realise는 \"실감하다, 깨닫다\"라는 뜻입니다. abut on ~은 \"~에 맞닿다, 인접하다\"라는 뜻입니다. stagnant는 \"정체된, 고여 있는\"이고 quit는 여기서 \"떠나다\"라는 뜻입니다."},
{"t": "‘Let me see,’ said Holmes, standing at the corner and glancing along the line, ‘I should like just to remember the order of the houses here.", "sk": "Let me see, said Holmes, I should like just to remember the order of the houses here.", "skk": "어디 보자, 홈즈가 모퉁이에 서서 그 줄지어 선 건물들을 훑어보며 말했다, 이곳 건물들의 순서를 기억해두고 싶네요.", "ko": "\"'어디 보자,' 홈즈가 모퉁이에 서서 늘어선 건물들을 훑어보며 말했습니다, '여기 건물들의 순서를 정확히 기억해두고 싶군요.'\"", "c": [["‘Let me see,’ said Holmes, standing at the corner and glancing along the line", "화자+동작", "'어디 보자,' 홈즈가 모퉁이에 서서 늘어선 건물들을 훑어보며 말했습니다", null], ["‘I should like just to remember the order of the houses here.", "바람", "'여기 건물들의 순서를 정확히 기억해두고 싶군요.", null]], "n": "glance along ~는 \"~을 따라 훑어보다\"라는 뜻입니다."},
{"t": "It is a hobby of mine to have an exact knowledge of London.", "sk": "It is a hobby of mine to have an exact knowledge of London.", "skk": "런던을 정확히 아는 게 제 취미거든요.", "ko": "\"런던을 정확하게 속속들이 아는 것이 제 취미거든요.\"", "c": [["It is a hobby of mine", "주어+동사", "그것이 제 취미입니다", null], ["to have an exact knowledge of London.", "무엇이 취미인지", "런던을 정확하게 속속들이 아는 것이", "hobby"]], "n": "hobby는 \"취미\"라는 뜻입니다."},
{"t": "There is Mortimer’s, the tobacconist, the little newspaper shop, the Coburg branch of the City and Suburban Bank, the Vegetarian Restaurant, and McFarlane’s carriage-building depot.", "sk": "There is Mortimer’s, the tobacconist, the newspaper shop, the bank, the restaurant, and the carriage-building depot.", "skk": "모티머네 담배 가게, 신문 가판대, 은행, 식당, 마차 제작소가 있죠.", "ko": "\"모티머네 담배 가게, 작은 신문 가판대, 시티 앤드 서버번 은행 코버그 지점, 채식 식당, 그리고 맥팔레인네 마차 제작소가 있습니다.\"", "c": [["There is Mortimer’s, the tobacconist, the little newspaper shop", "나열 ①", "모티머네 담배 가게, 작은 신문 가판대", null], ["the Coburg branch of the City and Suburban Bank, the Vegetarian Restaurant", "나열 ②", "시티 앤드 서버번 은행 코버그 지점, 채식 식당", null], ["and McFarlane’s carriage-building depot.", "나열 ③", "그리고 맥팔레인네 마차 제작소가 있습니다.", null]], "n": "tobacconist는 \"담배 가게(주인)\"이고, depot는 여기서 \"제작소, 작업장\"이라는 뜻입니다."},

{"t": "And now, Doctor, we’ve done our work, so it’s time we had some play.", "sk": "And now, Doctor, we’ve done our work, so it’s time we had some play.", "skk": "자, 의사 선생, 우리 일은 끝났으니 이제 놀 시간이에요.", "ko": "\"자, 의사 선생, 우리는 할 일을 다 했으니 이제 놀 시간입니다.\"", "c": [["And now, Doctor, we’ve done our work", "상황", "자, 의사 선생, 우리는 할 일을 다 했습니다", null], ["so it’s time we had some play.", "결론", "그러니 이제 놀 시간입니다.", null]], "n": "it’s time we had ~는 \"이제 ~할 때다\"라는 뜻입니다."},
{"t": "A sandwich and a cup of coffee, and then off to violin-land, where all is sweetness and delicacy and harmony, and there are no red-headed clients to vex us with their conundrums.’", "sk": "A sandwich and a cup of coffee, and then off to violin-land, and there are no red-headed clients to vex us with their conundrums.", "skk": "샌드위치와 커피 한 잔, 그러고 나서 바이올린의 나라로, 거기엔 우리를 골치 아프게 할 빨간 머리 손님이 없죠.", "ko": "\"'샌드위치와 커피 한 잔을 들고, 그러고 나서 바이올린의 나라로 갑시다, 그곳은 온통 달콤함과 섬세함과 조화로 가득하고, 우리를 수수께끼로 골치 아프게 할 빨간 머리 손님도 없는 곳이니까요.'\"", "c": [["A sandwich and a cup of coffee, and then off to violin-land", "제안", "'샌드위치와 커피 한 잔을 들고, 그러고 나서 바이올린의 나라로 갑시다", null], ["where all is sweetness and delicacy and harmony", "어떤 곳", "그곳은 온통 달콤함과 섬세함과 조화로 가득하고", "violin-land"], ["and there are no red-headed clients to vex us with their conundrums.’", "부연", "우리를 수수께끼로 골치 아프게 할 빨간 머리 손님도 없는 곳이니까요.'", null]], "n": "conundrum은 \"수수께끼, 난제\"라는 뜻입니다. vex는 \"골치 아프게 하다, 짜증나게 하다\"라는 뜻입니다."},
{"t": "My friend was an enthusiastic musician, being himself not only a very capable performer but a composer of no ordinary merit.", "sk": "My friend was an enthusiastic musician, being himself not only a very capable performer but a composer of no ordinary merit.", "skk": "제 친구는 열정적인 음악가였습니다, 그 자신이 뛰어난 연주자일 뿐 아니라 보통이 아닌 재능을 가진 작곡가이기도 했죠.", "ko": "\"제 친구는 열정적인 음악가였습니다, 그 자신이 매우 뛰어난 연주자일 뿐만 아니라 보통이 아닌 재능을 지닌 작곡가이기도 했습니다.\"", "c": [["My friend was an enthusiastic musician", "주어+동사", "제 친구는 열정적인 음악가였습니다", null], ["being himself not only a very capable performer but a composer of no ordinary merit.", "부연", "그 자신이 매우 뛰어난 연주자일 뿐만 아니라 보통이 아닌 재능을 지닌 작곡가이기도 했습니다.", null]], "n": "enthusiastic은 \"열정적인\"이고, composer는 \"작곡가\", merit는 \"훌륭함, 재능\"이라는 뜻입니다. not only A but B는 \"A뿐 아니라 B도\"라는 뜻입니다."},
{"t": "All the afternoon he sat in the stalls wrapped in the most perfect happiness, gently waving his long, thin fingers in time to the music, while his gently smiling face and his languid, dreamy eyes were as unlike those of Holmes the sleuth-hound, Holmes the relentless, keen-witted, ready-handed criminal agent, as it was possible to conceive.", "sk": "All the afternoon he sat in the stalls wrapped in happiness, waving his fingers in time to the music, while his smiling face and his dreamy eyes were as unlike those of Holmes the sleuth-hound as it was possible to conceive.", "skk": "오후 내내 그는 스톨석에 앉아 행복에 흠뻑 잠긴 채, 음악에 맞춰 손가락을 흔들었습니다, 웃음 짓는 얼굴과 몽롱한 눈이 명탐정 홈즈의 그것과는 상상할 수 없을 만큼 달랐습니다.", "ko": "\"오후 내내 그는 스톨석에 앉아 더없는 행복에 흠뻑 잠긴 채, 음악에 맞춰 길고 가느다란 손가락을 부드럽게 흔들었습니다, 그의 부드럽게 웃는 얼굴과 몽롱하고 꿈꾸는 듯한 눈은 냉철하고 예리하며 즉각적인 범죄 수사관인 명탐정 홈즈의 그것과는 도저히 상상할 수 없을 만큼 달랐습니다.\"", "c": [["All the afternoon he sat in the stalls wrapped in the most perfect happiness", "주어+동사", "오후 내내 그는 스톨석에 앉아 더없는 행복에 흠뻑 잠겨 있었습니다", null], ["gently waving his long, thin fingers in time to the music", "동시 동작", "음악에 맞춰 길고 가느다란 손가락을 부드럽게 흔들면서", null], ["while his gently smiling face and his languid, dreamy eyes were as unlike those of Holmes the sleuth-hound, Holmes the relentless, keen-witted, ready-handed criminal agent, as it was possible to conceive.", "대조", "그의 부드럽게 웃는 얼굴과 몽롱하고 꿈꾸는 듯한 눈은 냉철하고 예리하며 즉각적인 범죄 수사관인 명탐정 홈즈의 그것과는 도저히 상상할 수 없을 만큼 달랐습니다.", null]], "n": "stalls는 극장의 \"앞좌석\"을 뜻합니다. languid는 \"나른한\"이라는 뜻입니다. sleuth-hound는 원래 \"경찰견\"인데 여기서는 \"명탐정\"을 비유합니다. relentless는 \"가차 없는, 냉철한\", keen-witted는 \"예리한, 기지 넘치는\"이라는 뜻입니다. as A as it was possible to conceive는 \"상상할 수 있는 한 가장 A한\"이라는 뜻입니다."},
{"t": "In his singular character the dual nature alternately asserted itself, and his extreme exactness and astuteness represented, as I have often thought, the reaction against the poetic and contemplative mood which occasionally predominated in him.", "sk": "In his singular character the dual nature alternately asserted itself, and his extreme exactness and astuteness represented the reaction against the poetic and contemplative mood which occasionally predominated in him.", "skk": "그의 특이한 성격에서는 이중적인 본성이 번갈아 나타났습니다, 극도의 정확함과 영민함은 이따금 그를 지배하던 시적이고 사색적인 기분에 대한 반작용이었죠.", "ko": "\"그의 유별난 성격 속에서는 이중적인 본성이 번갈아 나타났습니다, 그리고 그의 극도의 정확함과 기민함은, 제가 자주 생각해왔듯, 이따금 그를 지배하던 시적이고 사색적인 기분에 대한 반작용이었습니다.\"", "c": [["In his singular character the dual nature alternately asserted itself", "주어+동사 ①", "그의 유별난 성격 속에서는 이중적인 본성이 번갈아 나타났습니다", null], ["and his extreme exactness and astuteness represented, as I have often thought, the reaction against the poetic and contemplative mood", "주어+동사 ②", "그리고 그의 극도의 정확함과 기민함은, 제가 자주 생각해왔듯, 그 반작용이었습니다", null], ["which occasionally predominated in him.", "어떤 기분", "이따금 그를 지배하던 시적이고 사색적인 기분에 대한", "mood"]], "n": "alternately는 \"번갈아\", exactness는 \"정확함\", astuteness는 \"기민함, 영민함\"이라는 뜻입니다. contemplative는 \"사색적인\", predominate는 \"우세하다, 지배하다\"라는 뜻입니다."},
{"t": "The swing of his nature took him from extreme languor to devouring energy; and, as I knew well, he was never so truly formidable as when, for days on end, he had been lounging in his armchair amid his improvisations and his black-letter editions.", "sk": "The swing of his nature took him from extreme languor to devouring energy; and he was never so truly formidable as when he had been lounging in his armchair amid his improvisations and his black-letter editions.", "skk": "그의 성정은 극도의 나른함에서 맹렬한 에너지로 오갔습니다, 그리고 그가 안락의자에 파묻혀 즉흥 연주와 고서들 속에 며칠씩 뒹굴었을 때만큼 진짜 무서웠던 적이 없었죠.", "ko": "\"그의 성정은 극도의 나른함에서 맹렬한 에너지로 오갔습니다, 그리고 제가 잘 알고 있듯, 그가 며칠씩 안락의자에 파묻혀 즉흥 연주와 고딕 활자체로 인쇄된 옛 책들 속에서 뒹굴고 있을 때만큼 그가 진정으로 무서웠던 적은 없었습니다.\"", "c": [["The swing of his nature took him from extreme languor to devouring energy", "주어+동사", "그의 성정은 극도의 나른함에서 맹렬한 에너지로 오갔습니다", null], ["and, as I knew well, he was never so truly formidable", "부연", "그리고 제가 잘 알고 있듯, 그가 진정으로 무서웠던 적은 없었습니다", null], ["as when, for days on end, he had been lounging in his armchair amid his improvisations and his black-letter editions.", "언제 그랬는지", "며칠씩 안락의자에 파묻혀 즉흥 연주와 고딕 활자체로 인쇄된 옛 책들 속에서 뒹굴고 있을 때만큼은", null]], "n": "languor는 \"나른함, 무기력\", devouring은 여기서 \"맹렬한\"이라는 뜻입니다. formidable은 \"만만치 않은, 무서운\"이라는 뜻이고, for days on end는 \"며칠씩 내리\"라는 뜻입니다. improvisation은 \"즉흥 연주\", black-letter는 \"고딕체(옛 활자체)로 인쇄된\"이라는 뜻입니다."},
{"t": "Then it was that the lust of the chase would suddenly come upon him, and that his brilliant reasoning power would rise to the level of intuition, until those who were unacquainted with his methods would look askance at him as on a man whose knowledge was not that of other mortals.", "sk": "Then it was that the lust of the chase would suddenly come upon him, and that his brilliant reasoning power would rise to the level of intuition, until those who were unacquainted with his methods would look askance at him.", "skk": "그럴 때면 갑자기 추적에 대한 갈망이 그를 사로잡았고, 뛰어난 추리력이 직관의 경지에 올랐죠, 그의 방법을 모르는 사람들이 그를 의심스레 곁눈질할 정도로.", "ko": "\"바로 그럴 때면 갑자기 추적에 대한 갈망이 그를 사로잡았고, 그의 뛰어난 추리력이 직관의 경지까지 치솟았습니다, 그의 방법을 잘 모르는 사람들이 그를 보통 사람과는 다른 지식을 가진 사람처럼 의심스레 곁눈질할 정도로요.\"", "c": [["Then it was that the lust of the chase would suddenly come upon him", "강조 구문 ①", "바로 그럴 때면 갑자기 추적에 대한 갈망이 그를 사로잡았습니다", null], ["and that his brilliant reasoning power would rise to the level of intuition", "강조 구문 ②", "그리고 그의 뛰어난 추리력이 직관의 경지까지 치솟았습니다", null], ["until those who were unacquainted with his methods would look askance at him as on a man whose knowledge was not that of other mortals.", "결과", "그의 방법을 잘 모르는 사람들이 그를 보통 사람과는 다른 지식을 가진 사람처럼 의심스레 곁눈질할 정도로요.", null]], "n": "lust는 여기서 \"열망, 갈망\"이라는 뜻입니다. unacquainted는 \"잘 모르는, 익숙하지 않은\", askance는 \"의심스럽게, 곁눈질로\"라는 뜻입니다. mortal은 \"인간, 보통 사람\"이라는 뜻입니다."},
{"t": "When I saw him that afternoon so enwrapped in the music at St. James’s Hall I felt that an evil time might be coming upon those whom he had set himself to hunt down.", "sk": "When I saw him that afternoon so enwrapped in the music I felt that an evil time might be coming upon those whom he had set himself to hunt down.", "skk": "그날 오후 세인트 제임스 홀에서 음악에 그토록 빠진 그를 보면서, 그가 뒤쫓기로 마음먹은 자들에게 안 좋은 시간이 다가오고 있다고 느꼈습니다.", "ko": "\"그날 오후 세인트 제임스 홀에서 음악에 그토록 깊이 빠져 있는 그를 보면서, 저는 그가 뒤쫓기로 마음먹은 자들에게 험한 시간이 다가오고 있음을 느꼈습니다.\"", "c": [["When I saw him that afternoon so enwrapped in the music at St. James’s Hall", "시점", "그날 오후 세인트 제임스 홀에서 음악에 그토록 깊이 빠져 있는 그를 보면서", null], ["I felt that an evil time might be coming upon those whom he had set himself to hunt down.", "주어+동사", "저는 험한 시간이 다가오고 있음을 느꼈습니다", "그가 뒤쫓기로 마음먹은 자들에게"]], "n": "enwrapped는 \"(음악 등에) 깊이 빠진, 몰입한\"이라는 뜻입니다. set oneself to ~는 \"~하기로 마음먹다, 작정하다\"라는 뜻입니다."},
{"t": "‘You want to go home, no doubt, Doctor,’ he remarked as we emerged.", "sk": "You want to go home, no doubt, Doctor, he remarked as we emerged.", "skk": "집에 가고 싶으시죠, 의사 선생, 우리가 나오면서 그가 말했다.", "ko": "\"'집에 가고 싶으시겠죠, 의사 선생,' 우리가 밖으로 나오면서 그가 말했습니다.\"", "c": [["‘You want to go home, no doubt, Doctor,’", "추측", "'집에 가고 싶으시겠죠, 의사 선생,'", null], ["he remarked as we emerged.", "누가 언제 말했는지", "우리가 밖으로 나오면서 그가 말했습니다.", null]], "n": "emerge는 \"(안에서) 나오다, 나타나다\"라는 뜻입니다."},
{"t": "‘Yes, it would be as well.’", "sk": "Yes, it would be as well.", "skk": "네, 그러는 게 낫겠어요.", "ko": "\"'네, 그러는 편이 낫겠습니다.'\"", "c": [["‘Yes, it would be as well.’", "대답", "'네, 그러는 편이 낫겠습니다.'", null]], "n": "it would be as well은 \"그러는 편이 낫겠다\"라는 뜻입니다."},

{"t": "I have every reason to believe that we shall be in time to stop it.", "sk": "I have every reason to believe that we shall be in time to stop it.", "skk": "우리가 그걸 막을 시간이 있다고 믿을 만한 충분한 이유가 있어요.", "ko": "\"우리가 그것을 막기에 늦지 않을 것이라 믿을 만한 충분한 이유가 있습니다.\"", "c": [["I have every reason to believe", "주어+동사", "저는 믿을 만한 충분한 이유가 있습니다", null], ["that we shall be in time to stop it.", "무엇을 믿는지", "우리가 그것을 막기에 늦지 않을 것이라고", "believe"]], "n": "have every reason to ~는 \"~할 충분한 이유가 있다\"라는 뜻입니다. in time to ~는 \"~하기에 늦지 않게\"라는 뜻입니다."},
{"t": "But to-day being Saturday rather complicates matters.", "sk": "But to-day being Saturday rather complicates matters.", "skk": "하지만 오늘이 토요일이라는 게 일을 좀 복잡하게 만드네요.", "ko": "\"하지만 오늘이 토요일이라는 점이 일을 다소 복잡하게 만듭니다.\"", "c": [["But to-day being Saturday", "주어", "하지만 오늘이 토요일이라는 점이", null], ["rather complicates matters.", "동사", "일을 다소 복잡하게 만듭니다.", null]], "n": "complicate는 \"복잡하게 만들다\"라는 뜻입니다."},

{"t": "‘Ten will be early enough.’", "sk": "Ten will be early enough.", "skk": "10시면 이를 거예요.", "ko": "\"'10시면 충분히 이를 겁니다.'\"", "c": [["‘Ten will be early enough.’", "대답", "'10시면 충분히 이를 겁니다.'", null]], "n": "early enough는 여기서 \"(늦지 않고) 충분히 이른\"이라는 뜻입니다."},
