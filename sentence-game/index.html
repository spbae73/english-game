<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장 완성 게임 — Red-Headed League</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-top">
      <div>
        <h1>문장 완성 게임</h1>
        <p class="byline">뼈대만 남기고 나머지는 빈칸! 빈칸을 고르고, 맞는 단어를 골라 채워보세요.</p>
      </div>
      <div class="font-ctrl" role="group" aria-label="글자 크기 조절">
        <button id="fontDec" type="button" title="글자 작게 (A−)" aria-label="글자 작게">A−</button>
        <button id="fontReset" type="button" title="기본 크기 복원 (100%)" aria-label="기본 크기 복원">100%</button>
        <button id="fontInc" type="button" title="글자 크게 (A+)" aria-label="글자 크게">A+</button>
      </div>
    </div>
  </header>

  <div id="setup" class="card hidden">
    <div class="lab">난이도를 골라주세요</div>
    <div class="pickrow">
      <button class="pick" data-diff="base">기본<span class="best">오답 없음</span></button>
      <button class="pick" data-diff="d30">도전<span class="best">오답 +30%</span></button>
      <button class="pick" data-diff="d50">고난도<span class="best">오답 +50%</span></button>
    </div>
    <p class="hint">오답 단어는 사전에 있는 다른 단어 중에서 골라 섞습니다. 최소 2개, 최대 8개까지만 추가됩니다.</p>
  </div>

  <div id="empty" class="card hidden">
    <p class="hint">아직 읽은 대목이 없습니다.<br>읽기 페이지에서 한 대목을 읽고 오세요.</p>
  </div>

  <div id="game" class="hidden"></div>

  <p class="foot">빈칸을 누르면 선택되고, 아래 단어를 누르면 그 자리에 맞는지 확인합니다.<br>
  채운 칸을 다시 누르면 되돌릴 수 있습니다. 읽기 페이지에서 읽은 대목까지만 출제되고,<br>
  진행 상황, 난이도, 글자 크기는 이 브라우저에 저장됩니다.</p>
</div>

<script src="../word-game/words.js"></script>
<script src="sentdata.js"></script>
<script src="game.js"></script>
</body>
</html>
